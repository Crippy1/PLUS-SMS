<script>
/* ================= SCORES · CONVERSION RULES · PERFORMANCE · BECE ================= */
window.A = window.A || {};
let SC={cls:'',sub:'',term:'Term 1',view:'entry'};

function scoreableClasses(){
  const u=me(); const s=mySchool();
  if(u.role==='teacher'){ const scope=teacherScope(u); return [...scope.ids].map(id=>classOf(s,id)).filter(Boolean); }
  return sortClasses(s);
}
function scoreableSubjects(cls){
  const u=me(); const s=mySchool(); const all=studentSubjectsForClass(s,cls);
  if(u.role==='teacher'){ const scope=teacherScope(u); return all.filter(x=>scope.can(cls.id,x)); }
  return all;
}
function renderScores(){
  const _termClosed=!termConfigured(mySchool());
  const s=mySchool(); const year=yearSel();
  const classes=scoreableClasses();
  if(!SC.cls && classes.length) SC.cls=classes[0].id;
  const cls=classes.find(c=>c.id===SC.cls);
  const subs=cls? scoreableSubjects(cls):[];
  if(cls && !subs.includes(SC.sub)) SC.sub=subs[0]||'';
  if(cls && !termsForClass(cls).includes(SC.term)) SC.term=termsForClass(cls)[0];
  const termClosedNote=_termClosed? '<div class="notice bad mb2">🔒 <b>Results entry is closed</b> — the School Admin must first set the current Term duration (Start Date and End Date) in Academic Settings.</div>' : '';
  const w=cls?convRules(cls.stream):{c:50,e:50};
  return `
  ${termClosedNote}
  <div class="tabs">
    <div class="tab ${SC.view==='entry'?'on':''}" onclick="A.scView('entry')">🧮 Score entry</div>
    <div class="tab ${SC.view==='perf'?'on':''}" onclick="A.scView('perf')">📊 Performance & aggregates</div>
  </div>
  <div class="card mb2">
    <div class="flex wrap">
      <div><label>Class</label><select style="width:190px" onchange="A.scSet('cls',this.value)">
        ${classes.map(c=>`<option value="${c.id}" ${SC.cls===c.id?'selected':''}>[${c.stream}] ${esc(c.name)}</option>`).join('')}</select></div>
      <div><label>Term</label><select style="width:130px" onchange="A.scSet('term',this.value)">
        ${cls?termsForClass(cls).map(t=>`<option ${SC.term===t?'selected':''}>${t}</option>`).join(''):''}</select>
        ${cls&&isBasic9(cls)?'<div class="small mut">Basic 9 → 2 terms only</div>':''}</div>
      <div><label>Academic year</label><input style="width:120px" value="${year}" disabled></div>
      ${SC.view==='entry'?`<div><label>Subject</label><select style="width:220px" onchange="A.scSet('sub',this.value)">
        ${subs.map(x=>`<option ${SC.sub===x?'selected':''}>${esc(x)}</option>`).join('')}</select></div>`:''}
      <div class="grow"></div>
      ${me().role==='schooladmin'?`<button class="btn gold" onclick="A.convModal()">⚖ Conversion rules</button>`:''}
    </div>
    ${cls?`<details class="desc-strip" style="margin-top:.8rem"><summary>⚖ <b>${esc(cls.stream)} conversion — how marks convert</b><span class="ds-hint">tap to read ▾</span></summary>
      <div class="ds-body">⚖ <span>Class score (raw /50) counts <b>${w.c}%</b>, Exam (raw /100) counts <b>${w.e}%</b> across <b>all subjects</b> in this stream. Converted columns below are what appear on reports — never raw scores.</span></div></details>`:'<div class="notice warn mini mt2">No class selected.</div>'}
  </div>
  ${SC.view==='entry'? scoreEntryHTML(cls, year) : perfHTML(cls, year)}`;
}
A.scView=v=>{SC.view=v; render();};
/* Round-30: tap a subject-average bar → per-student converted totals for that subject */
A.subAvgTap=function(si){
  const s=mySchool(); const year=yearSel(); const cls=classOf(s,SC.cls);
  if(!cls) return;
  const subs=studentSubjectsForClass(s,cls); const sub=subs[si]; if(sub==null) return;
  const studs=activeStudents(s.id).filter(st=>st.classId===cls.id).sort(cmpStudents);
  const rows=studs.map(st=>({st, t:studentTotal(st.id,sub,SC.term,year,cls.stream)}));
  const scored=rows.filter(r=>r.t!==null);
  const avg=scored.length? r1(scored.reduce((a,r)=>a+r.t,0)/scored.length):null;
  const data=scored.map(r=>({label:(r.st.firstName[0]||'')+'. '+r.st.surname, value:r.t, color:gradeColor(r.t)}));   // Round-32: bars carry the grade colour
  openModal(`${mHead('📊 '+esc(sub)+' — '+esc(cls.name)+' · '+SC.term, true)}<div class="m-body">
  <div class="small mut mb1">Class average <b>${avg===null?'—':avg}</b> (${scored.length}/${studs.length} scored) — each student's converted total <b>as a bar</b>, green ≥ 50%.</div>
  ${data.length? barChartSVG(data) : emptyMini('No scores yet for this subject this term.')}</div>
  <div class="m-foot"><button class="btn" onclick="A.closeModal()">Close</button></div>`);
};
A.scSet=(k,v)=>{SC[k]=v; render();};

function scoreEntryHTML(cls, year){
  if(!cls) return '<div class="card empty"><span class="e-ic">🏫</span>No classes available for your role.</div>';
  if(!SC.sub) return '<div class="card empty"><span class="e-ic">📚</span>No subjects assigned to this stream yet — see Subjects → assignment matrix.</div>';
  const s=mySchool();
  const studs=activeStudents(s.id).filter(st=>st.classId===cls.id).sort(cmpStudents);
  const w=convRules(cls.stream);
  const pre=SC.sub.replace(/[^A-Za-z0-9]/g,'');
  return `
  <div class="card">
  <h3>🧮 ${esc(SC.sub)} — ${esc(cls.name)} · ${SC.term} · ${year}</h3>
  <div class="table-wrap"><table><thead><tr><th>#</th><th>Student</th><th>ID</th>
    <th>Class score<br><span class="small">raw 0–50</span></th><th>Exam score<br><span class="small">raw 0–100</span></th>
    <th>→ Class ${w.c}%</th><th>→ Exam ${w.e}%</th><th>Converted total</th><th>Grade</th></tr></thead><tbody>
  ${studs.map((st,i)=>{ const sc=getScore(st.id,SC.sub,SC.term,year)||{c:'',e:''};
    return `<tr data-stu="${st.id}">
    <td class="small mut">${i+1}</td><td>${esc(st.firstName)} ${esc(st.surname)}</td><td class="small mut">${esc(st.sid)}</td>
    <td><input class="score-in" type="number" min="0" max="50" step="0.5" id="c-${pre}-${st.id}" value="${sc.c===''?'':sc.c}" oninput="A.convRow('${pre}','${st.id}','${cls.stream.replace(/'/g,"\\'")}')"></td>
    <td><input class="score-in" type="number" min="0" max="100" step="0.5" id="e-${pre}-${st.id}" value="${sc.e===''?'':sc.e}" oninput="A.convRow('${pre}','${st.id}','${cls.stream.replace(/'/g,"\\'")}')"></td>
    <td class="small mut" id="cc-${pre}-${st.id}"></td><td class="small mut" id="ce-${pre}-${st.id}"></td>
    <td class="b" id="ct-${pre}-${st.id}"></td><td id="cg-${pre}-${st.id}"></td></tr>`;}).join('')||'<tr><td colspan="9" class="center mut">No students in this class.</td></tr>'}
  </tbody></table></div>
  <div class="flex between mt2 wrap">
    <div class="small mut">Validation: class ≤ 50, exam ≤ 100. Converted marks update live using the stream's rule.</div>
    <button class="btn" onclick="A.saveScores('${cls.id}','${pre}')">💾 Batch save scores</button>
  </div></div>`;
}
function afterRenderScores(){
  if(SC.view!=='entry') return;
  const s=mySchool(); const cls=s? classOf(s, SC.cls):null; if(!cls||!SC.sub) return;
  const pre=SC.sub.replace(/[^A-Za-z0-9]/g,'');
  $$('tr[data-stu]').forEach(tr=>A.convRow(pre, tr.dataset.stu, cls.stream));
}
A.convRow=function(pre, stuId, stream){
  const cEl=$('#c-'+pre+'-'+stuId), eEl=$('#e-'+pre+'-'+stuId); if(!cEl||!eEl) return;
  let cv=cEl.value===''?'':Math.min(50,Math.max(0,parseFloat(cEl.value)||0));
  let ev=eEl.value===''?'':Math.min(100,Math.max(0,parseFloat(eEl.value)||0));
  cEl.style.borderColor = cv!==''&&parseFloat(cEl.value)>50? 'var(--bad)':'';
  eEl.style.borderColor = ev!==''&&parseFloat(eEl.value)>100? 'var(--bad)':'';
  if(cv===''&&ev===''){ $('#cc-'+pre+'-'+stuId).textContent=''; $('#ce-'+pre+'-'+stuId).textContent=''; $('#ct-'+pre+'-'+stuId).textContent=''; $('#cg-'+pre+'-'+stuId).innerHTML=''; return; }
  const conv=convertScore(cv===''?0:cv, ev===''?0:ev, stream);
  $('#cc-'+pre+'-'+stuId).textContent=conv.c;
  $('#ce-'+pre+'-'+stuId).textContent=conv.e;
  $('#ct-'+pre+'-'+stuId).textContent=conv.total;
  const g=gradeBand(conv.total);
  $('#cg-'+pre+'-'+stuId).innerHTML=`<span class="badge" style="background:${gradeColor(g[0])};color:#fff">${g[0]}</span>`;
};
A.saveScores=function(clsId, pre){
  if(featureBlocked('results')) return lockFeatureToast('Results upload');
  if(!termConfigured(mySchool())) return toast('🔒 Results entry is closed — the School Admin must first set the current Term duration (Start Date and End Date) in Academic Settings.','bad');
  const cls=classOf(mySchool(), clsId);
  const s=mySchool(); const year=yearSel();
  const studs=activeStudents(s.id).filter(st=>st.classId===clsId);
  let bad=0, n=0;
  studs.forEach(st=>{
    const cEl=$('#c-'+pre+'-'+st.id), eEl=$('#e-'+pre+'-'+st.id); if(!cEl) return;
    const cv=cEl.value, ev=eEl.value;
    if(cv===''&&ev==='') { delete DB.scores[scoreKey(st.id,SC.sub,SC.term,year)]; return; }
    const c=parseFloat(cv)||0, e=parseFloat(ev)||0;
    if(c<0||c>50||e<0||e>100){ bad++; return; }
    DB.scores[scoreKey(st.id,SC.sub,SC.term,year)]={c, e}; n++;
  });
  saveDB();
  if(bad) toast(`⚠ ${bad} row(s) skipped — scores out of range (class 0–50, exam 0–100)`,'bad');
  toast(`Saved ${n} score rows for ${SC.sub} (${SC.term})`,'ok');
};

/* ---------- CONVERSION RULES (SchoolAdmin sets per stream) ---------- */
A.convModal=function(){
  const s=mySchool(); s.conversion=s.conversion||{};
  openModal(`${mHead('⚖ Score conversion rules — per stream')}
  <div class="m-body">
    <div class="notice info mini mb2">Set how raw scores convert to final marks <b>for every subject in each stream</b>.
    Example: class 30% / exam 70% → a raw class score of 40/50 gives <b>(40/50)×30 = 24</b>; exam 70/100 gives <b>(70/100)×70 = 49</b>; total = <b>73</b>.
    Weights must add to 100.</div>
    <div class="table-wrap"><table><thead><tr><th>Stream</th><th>Class score weight %</th><th>Exam weight %</th><th>Check</th></tr></thead><tbody>
    ${STREAMS_ORDER.map(st=>{ const r=convRules(st);
      const pid=st.replace(/\s/g,'');
      return `<tr><td><b>${st}</b></td>
      <td><input type="number" min="0" max="100" id="cw-${pid}" value="${r.c}" style="width:90px" oninput="$('#ck-${pid}').innerHTML=A.ckW('${pid}')"></td>
      <td><input type="number" min="0" max="100" id="ew-${pid}" value="${r.e}" style="width:90px" oninput="$('#ck-${pid}').innerHTML=A.ckW('${pid}')"></td>
      <td id="ck-${pid}" class="small">${(r.c+r.e===100)?'<span class="ok b">✔ =100</span>':'<span class="bad b">must be 100</span>'}</td></tr>`;}).join('')}

/* how complete is score entry for this class+term? gates auto-remarks */
function classScoreCompleteness(s, cls, term, year){
  const subs=studentSubjectsForClass(s,cls);
  const studs=activeStudents(s.id).filter(st=>st.classId===cls.id);
  if(!subs.length||!studs.length) return {pct:0, done:false};
  let filled=0; const total=subs.length*studs.length;
  subs.forEach(sub=>studs.forEach(st=>{ if(getScore(st.id,sub,term,year)) filled++; }));
  const pct=Math.round(filled/total*100);
  return {pct, done:pct>=100, filled, total};
}

/* ================= COMMUNICATION (SuperAdmin↔Admin, Admin↔Teachers) ================= */
function msgVisibleTo(u,m){ if(u.role==='superadmin') return m.scope==='sa';
  if(u.role==='schooladmin') return m.schoolId===u.schoolId;
  if(u.role==='teacher') return m.schoolId===u.schoolId && (m.scope==='broadcast' || m.scope==='direct'&&(m.toUserId===u.id||m.fromId===u.id));
  return false; }
function msgsFor(u, filter){ return DB.messages.filter(m=>msgVisibleTo(u,m)&&(!filter||filter(m))).sort((a,b)=>a.ts-b.ts); }
function unreadMsgCount(u){ return DB.messages.filter(m=>msgVisibleTo(u,m)&&m.fromId!==u.id&&!(m.read||[]).includes(u.id)).length; }
function markMsgsRead(u){ let ch=false; DB.messages.forEach(m=>{ if(msgVisibleTo(u,m)&&m.fromId!==u.id){ m.read=m.read||[]; if(!m.read.includes(u.id)){ m.read.push(u.id); ch=true; } } }); if(ch) saveDB(); }
function msgBubble(m,u){ const mine=m.fromId===u.id; const when=new Date(m.ts).toLocaleString('en-GB',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'});
  return `<div class="msg-b ${mine?'msg-me':'msg-them'}">${esc(m.text)}<div class="msg-meta">${mine?'You':esc(m.fromName)+' · '+m.fromRole.replace('schooladmin','School Admin').replace('superadmin','Super Admin').replace('teacher','Teacher')} · ${when}</div></div>`; }
function commHTML(u){ const s=mySchool(); markMsgsRead(u);

function currentTermName(s){ return (s&&s.currentTerm)||((s&&s.terms&&s.terms[0])?s.terms[0].name:'Term 1'); }
function currentTermObj(s){ const n=currentTermName(s); return (s&&(s.terms||[]).find(t=>t.name===n))||null; }
function termConfigured(s){ const t=currentTermObj(s); return !!(t&&t.start&&t.end); }
function curTermRange(s){ const t=currentTermObj(s); return (t&&t.start&&t.end)? `${fmtD(t.start)} → ${fmtD(t.end)}` : 'not set'; }
function termFrameIssue(s){ if(!s) return null; return (s.terms||[]).find(t=>!t.start||!t.end)||null; }
function termFrameAlertHTML(u){ if(!u||(u.role!=='schooladmin'&&u.role!=='teacher')) return '';

        <input value="${esc(h.name)}" style="width:110px;padding:.3rem .5rem;font-size:.82rem" onchange="A.houseName('${h.id}',this.value)">
      </div></div>`;}).join('')}
  </div>
  <div class="card mt3"><h3>⚖ Deploy students evenly across houses</h3>
    <div class="flex wrap">
      <div><label>From class <span class="mut">(pre-school excluded)</span></label><select id="deploy-cls" style="width:220px">
        ${sortClasses(s).filter(c=>c.stream!=='Pre-school').map(c=>`<option value="${c.id}">[${c.stream}] ${esc(c.name)}</option>`).join('')}

function housesFrom(s, startId){
  const hs=(s.houses||[]).slice();
  const i=Math.max(0, hs.findIndex(h=>h.id===startId));
  return hs.slice(i).concat(hs.slice(0,i));   // rotate so deployment starts from the chosen house
}
/* gender-balanced deployment: boys & girls distributed separately, evenly */
function deployPool(s, pool, startId){
  const hs=housesFrom(s,startId); if(!hs.length) return 0;
  const poolIds=new Set(pool.map(st=>st.id));
  const counts=hs.map((h,o)=>({
    id:h.id, o,
    m:DB.students.filter(st=>st.houseId===h.id&&!st.archived&&!poolIds.has(st.id)&&st.gender==='M').length,
    f:DB.students.filter(st=>st.houseId===h.id&&!st.archived&&!poolIds.has(st.id)&&st.gender==='F').length
  }));
  const assign=(st)=>{
    counts.sort((a,b)=>((st.gender==='M'? a.m-b.m : a.f-b.f)||a.o-b.o));
    st.houseId=counts[0].id;
    if(st.gender==='M') counts[0].m++; else counts[0].f++;
  };
  pool.filter(st=>st.gender==='M').forEach(assign);
  pool.filter(st=>st.gender==='F').forEach(assign);
  return pool.length;
}
/* deploy from the chosen class onward (spills to next classes), gender-balanced, pre-school excluded */
A.deployHouses=function(){
  const s=mySchool(); const cid=$('#deploy-cls').value; const startId=$('#deploy-start').value;
  const ladder=sortClasses(s).filter(c=>c.stream!=='Pre-school');
  const i=ladder.findIndex(c=>c.id===cid);
  if(i<0) return toast('Pick a class','bad');
  const pool=[];
  for(let k=i;k<ladder.length;k++) pool.push(...activeStudents(s.id).filter(st=>st.classId===ladder[k].id));
  if(!pool.length) return toast('No students from that class onward','bad');
  const n=deployPool(s,pool,startId);
  saveDB(); render();
  toast(`Deployed ${n} students (${ladder[i].name} → ${ladder[ladder.length-1].name}) — equal boys &amp; girls per house, starting at ${housesFrom(s,startId)[0].name} ⚖`,'ok');
};
A.autoAssignAll=function(){
  const s=mySchool(); const startId=$('#deploy-start')? $('#deploy-start').value : (s.houses[0]||{}).id;
  const preIds=new Set(s.classes.filter(c=>c.stream==='Pre-school').map(c=>c.id));
  const pool=activeStudents(s.id).filter(st=>!preIds.has(st.classId));   // pre-school excluded
  const n=deployPool(s,pool,startId);
  saveDB(); render();
  toast(`Rebalanced ${n} students — every house now has an equal share of boys and girls (pre-school excluded)`,'ok');
};

A.saveComm=function(){
  const s=mySchool();
  const name=$('#cm-name').value.trim(); if(!name) return toast('Name required','bad');

/* ================= PTA REGISTER (parents grouped by class — download / print for meetings) ================= */
let PTA_CLS='';
function ptaGroups(s){
  return sortClasses(s)
    .filter(c=>!PTA_CLS || c.id===PTA_CLS)
    .map(c=>{
      const rows=activeStudents(s.id).filter(st=>st.classId===c.id)
        .sort(cmpStudents)
        .map(st=>{
          const par=DB.users.find(u=>u.role==='parent'&&u.schoolId===s.id&&u.phone===st.parentPhone);
          return { st, parentName: par? par.name : '', phone: st.parentPhone||'', rel: st.relationship||'', registered: !!par };
        });
      return { cls:c, rows };
    }).filter(g=>g.rows.length);
}
function renderPTA(){
  const s=mySchool();
  const groups=ptaGroups(s);
  const total=groups.reduce((a,g)=>a+g.rows.length,0);
  const regd=groups.reduce((a,g)=>a+g.rows.filter(r=>r.registered).length,0);

      <span class="badge ok">${regd} on parent portal</span>

  <div class="small mut">Guardians are <b>grouped by class</b> for teacher–parent meetings. Parents not yet on the portal appear with the phone on the ward's admission record. The print sheet has ✔ / signature columns for marking attendance.</div>
  </div>
  ${groups.map(g=>`
  <div class="card mb2"><h3>🤝 ${esc(g.cls.name)} <span class="tag">${g.cls.stream}</span> <span class="badge info">${g.rows.length}</span></h3>
    <div class="table-wrap"><table><thead><tr><th>#</th><th>Parent / Guardian</th><th>Phone</th><th>Relationship</th><th>Ward</th><th>Ward ID</th></tr></thead><tbody>
    ${g.rows.map((r,i)=>`<tr>
      <td class="small mut">${i+1}</td>
      <td>${r.registered? `<b>${esc(r.parentName)}</b> <span class="badge ok" title="Has portal account">portal</span>` : `<span class="mut">— (not on portal)</span>`}</td>
      <td class="b">${esc(r.phone)}</td>
      <td class="small">${esc(r.rel)}</td>
      <td>${esc(r.st.firstName)} ${esc(r.st.surname)}</td>
      <td class="small mut">${esc(r.st.sid)}</td>
    </tr>`).join('')}
    </tbody></table></div>
  </div>`).join('')||'<div class="card empty"><span class="e-ic">🤝</span>No guardian contacts yet — register students first.</div>'}
  `;
}
A.ptaCSV=function(){
  const s=mySchool(); const groups=ptaGroups(s);
  if(!groups.length) return toast('Nothing to download','bad');
  const lines=['Class,Stream,Parent/Guardian,On Portal,Phone,Relationship,Ward Name,Ward ID'];
  groups.forEach(g=>g.rows.forEach(r=>{
    lines.push([g.cls.name, g.cls.stream, r.registered? r.parentName : '(not on portal)', r.registered?'Yes':'No',
      r.phone, r.rel, `${r.st.firstName} ${r.st.surname}`, r.st.sid]
      .map(x=>'"'+String(x).replace(/"/g,'""')+'"').join(','));
  }));
  const blob=new Blob(['\ufeff'+lines.join('\n')],{type:'text/csv'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob);
  a.download=(s.abbrev||'school')+'_PTA_register.csv'; a.click();
  toast('PTA register downloaded — grouped by class ⬇','ok');
};

      <tbody>${g.rows.map((r,i)=>`<tr><td>${i+1}</td><td>${esc(r.registered? r.parentName : '(not on portal)')}</td>

<script>

A.recordPayment=function(){

function promoTabHTML(s, year){
  const ladder=sortClasses(s);
  return `<div class="card"><h3>⬆ End-of-year promotion <span class="badge gold">auto next-class fee calculation</span></h3>
  <details class="desc-strip"><summary>⬆ <b>How promotion &amp; next-class fees work</b><span class="ds-hint">tap to read ▾</span></summary>
  <div class="ds-body">⬆ <span>Promoting a class moves every student to the <b>next class</b> on the ladder (KG 2 → Basic 1 … Basic 6D → Basic 7 … Basic 9D → graduated). The system automatically: <b>1)</b> attaches the new class's fee structure and <b>2)</b> <b>carries forward any outstanding debt</b> — the total shows on the student's next receipt.</span></div></details>
  <div class="table-wrap"><table><thead><tr><th>From class</th><th>Students</th><th>→ Next class</th><th>Next-class fees (set?)</th><th>Debt to carry</th><th></th></tr></thead><tbody>
  ${ladder.map((c,i)=>{
    const studs=activeStudents(s.id).filter(st=>st.classId===c.id);
    if(!studs.length) return '';
    const next=ladder[i+1];
    const debt=studs.reduce((a,st)=>a+Math.max(0,balanceOf(st,year)),0);
    const nextSet= next? !!feeStruct(s,next.id,year) : null;
    return `<tr><td><b>${esc(c.name)}</b> <span class="tag">${c.stream}</span></td><td>${studs.length}</td>
      <td>${next?`<b>${esc(next.name)}</b> <span class="tag">${next.stream}</span>`:'<span class="badge gold">🎓 Graduate / archive</span>'}</td>
      <td>${next===null?'—': nextSet?`<span class="ok">✔ ${ghs(structTotal(s,next.id,year))}</span>`:'<span class="bad">⚠ not set — set in Fee structure tab</span>'}</td>
      <td class="${debt>0?'bad b':''}">${ghs(debt)}</td>
      <td><button class="btn sm ${nextSet||next===null?'':'ghost'}" onclick="A.promoteClass('${c.id}')">⬆ Promote</button></td></tr>`;
  }).join('')||'<tr><td colspan="6" class="center mut">No students to promote.</td></tr>'}
  </tbody></table></div></div>`;
}
A.promoteClass=function(classId){
  if(!needCash()) return;
  const s=mySchool(); const year=yearSel();
  const ladder=sortClasses(s);
  const idx=ladder.findIndex(c=>c.id===classId); const from=ladder[idx]; const next=ladder[idx+1];
  const studs=activeStudents(s.id).filter(st=>st.classId===classId);
  if(!studs.length) return toast('No students in '+from.name,'bad');
  const nextFees = next? structTotal(s,next.id,year):0;
  const totalDebt = studs.reduce((a,st)=>a+Math.max(0,balanceOf(st,year)),0);
  if(!confirm(`Promote ${studs.length} students from ${from.name} → ${next?next.name:'GRADUATED (archived)'}?\n\nEach student gets:\n• New class fees: ${ghs(nextFees)}\n• Plus carried debt: ${ghs(totalDebt/studs.length||0)} avg (actual per student)\n\nTotal attached to next receipts: new fees + their own outstanding balance.`)) return;
  studs.forEach(st=>{
    const debt=Math.max(0, balanceOf(st,year));
    if(next){ st.classId=next.id; st.carried={year, amount:debt, from:from.name}; }
    else { st.archived=true; st.graduated=true; st.archivedAt=Date.now(); st.carried={year, amount:debt, from:from.name}; }
  });
  saveDB(); render();
  toast(`Promoted ${studs.length} students → ${next?next.name:'graduated'}. Debt carried: ${ghs(totalDebt)}`,'ok');
};

/* ---------- DEBT TRACKING ---------- */
let DEBT_F={stream:'', cls:'', type:'', group:'stream'};
const DEBT_TYPES=[{k:'fees',t:'💵 Tuition fees'},{k:'carried',t:'↪ Carried-forward debt'},{k:'canteen',t:'🍚 Canteen fees'}];
function debtorsRows(s, year){
  return activeStudents(s.id).map(st=>({st, c:classOf(s,st.classId), d:debtBreakdown(s,st,year)}))
    .filter(r=>r.d.total>0 && r.c);
}
function debtorsFiltered(s, year){
  let rows=debtorsRows(s,year);
  if(DEBT_F.stream) rows=rows.filter(r=>r.c.stream===DEBT_F.stream);
  if(DEBT_F.cls)    rows=rows.filter(r=>r.st.classId===DEBT_F.cls);
  if(DEBT_F.type==='fees')    rows=rows.filter(r=>r.d.fees>0);
  if(DEBT_F.type==='carried') rows=rows.filter(r=>r.d.carried>0);
  if(DEBT_F.type==='canteen') rows=rows.filter(r=>r.d.cant>0);
  return rows;
}
function debtorsByType(rows){
  const g=(name,sub,key)=>{ const rr=rows.filter(r=>r.d[key]>0).sort((a,b)=>cmpStudents(a.st,b.st));
    return rr.length? {stm:name, rows:rr, typeKey:key, typeSub:r1(rr.reduce((a,r)=>a+r.d[key],0))} : null; };
  return [g('💵 Tuition fees','owing on fees','fees'), g('↪ Carried-forward debt','from previous years','carried'), g('🍚 Canteen fees','unpaid canteen','cant')].filter(Boolean);
}
function debtorsByStream(rows){
  return STREAMS_ORDER.map(stm=>({stm, rows:rows.filter(r=>r.c.stream===stm).sort((a,b)=>cmpStudents(a.st,b.st))}))
    .filter(g=>g.rows.length);
}

/* ---------- CANTEEN (daily rate per stream; weekly / monthly / termly accumulation) ---------- */
let CT={cls:'', plan:'all', week:currentWeekISO(), month:new Date().toISOString().slice(0,7), term:'Term 1'};
let CQ={stream:'', cls:'', stu:''};   // quick-pay cascade selection
const CT_PLANS=[['weekly','📆 Weekly'],['monthly','📅 Monthly'],['termly','🗓 Termly']];
function ctnDaily(s, stream){ s.canteenDaily=s.canteenDaily||{}; return parseFloat(s.canteenDaily[stream])||0; }
function ctKey(plan, year){ return plan==='weekly'? 'W:'+CT.week : plan==='monthly'? 'M:'+CT.month : 'T:'+year+':'+CT.term; }
function ctPeriodLabel(plan, year){ return plan==='weekly'? '📆 week '+CT.week : plan==='monthly'? '📅 '+CT.month : '🗓 '+CT.term+' · '+year; }
function ctPeriodDays(s, plan, year){
  const hols=allHolidaySet(s);
  if(plan==='weekly')  return countWeekdaysInWeek(CT.week, hols);
  if(plan==='monthly') return countWeekdaysInMonth(CT.month, hols);
  const t=(s.terms||[]).find(x=>x.name===CT.term); return expectedDays(t);
}

    return `<div class="small mb1">• ${st?`<b>${esc(st.firstName+' '+st.surname)}</b> `:'<b>'+esc(p.className||'')+'</b> '}
    ${badge} <b>${ghs(p.amount||0)}</b> · ${esc(p.periodLabel||'')} <span class="mut">(${fmtD(p.date)})</span></div>`;}).join('')||'<div class="small mut">None yet.</div>'}

/* ----- quick single-student payment: stream → class → student ----- */
function quickPayHTML(s, year){
  const classes=sortClasses(s);
  const streams=STREAMS_ORDER.filter(st=>classes.some(c=>c.stream===st));
  if(!CQ.stream || !streams.includes(CQ.stream)) CQ.stream=streams[0]||'';
  const sCls=classes.filter(c=>c.stream===CQ.stream);
  if(!CQ.cls || !sCls.some(c=>c.id===CQ.cls)) CQ.cls=sCls[0]? sCls[0].id:'';
  const studs=CQ.cls? activeStudents(s.id).filter(st=>st.classId===CQ.cls).sort(cmpStudents):[];
  if(!CQ.stu || !studs.some(st=>st.id===CQ.stu)) CQ.stu=studs[0]? studs[0].id:'';
  const st=studs.find(x=>x.id===CQ.stu)||null;
  const cls=CQ.cls? classOf(s,CQ.cls):null;
  let panel='<div class="small mut">Pick a student to see the automatically accumulated amount.</div>';
  if(st&&cls){
    const daily=ctnDaily(s,cls.stream);
    if(!st.canteenPlan){
      panel=`<div class="notice warn mini">⚠ <b>${esc(st.firstName)} ${esc(st.surname)}</b> (${esc(cls.name)}) is not subscribed yet — choose a basis:
      <span class="flex mt1">${CT_PLANS.map(([pl,lbl])=>`<button class="btn sm gold" onclick="A.ctPlan('${st.id}','${pl}')">${lbl}</button>`).join('')}</span></div>`;
    } else {
      const plan=st.canteenPlan, days=ctPeriodDays(s,plan,year), amt=r1(daily*days), key=ctKey(plan,year);
      const paid=DB.canteenPay.some(p=>p.studentId===st.id&&p.plan===plan&&p.period===key);
      const daysNote = plan==='termly'? ` <span class="small mut">(= total attendance days of ${CT.term})</span>`:'';
      panel=`<div class="flex wrap between" style="gap:.8rem">
        <div><div class="b">${esc(st.firstName)} ${esc(st.surname)} <span class="tag">${esc(cls.name)} · ${cls.stream}</span></div>
        <div class="mt1">${{weekly:'<span class="badge ok">📆 weekly</span>',monthly:'<span class="badge info">📅 monthly</span>',termly:'<span class="badge gold">🗓 termly</span>'}[plan]}
        <span class="small mut">→ ${ctPeriodLabel(plan,year)}</span></div>
        <div class="mt1 small">Accumulated: <b>${ghs(daily)}/day</b> × <b>${days} feeding day(s)</b>${daysNote}
        = <b style="font-size:1.15rem;color:var(--brand)">${ghs(amt)}</b></div></div>
        <div>${paid? `<span class="badge ok">Paid ✔</span> <button class="btn sm ghost" onclick="A.ctUndo('${st.id}')">↩ Undo</button>`
          : `<button class="btn" ${amt>0?'':'disabled'} onclick="A.ctPay('${st.id}')">💵 Record ${ghs(amt)}</button>`}
          <button class="btn sm ghost" onclick="A.ctPlan('${st.id}','')" title="Remove from canteen">✖</button></div>
      </div>`;
      if(!(daily>0)) panel=`<div class="notice warn mini">⚠ Set the daily rate for <b>${cls.stream}</b> above first.</div>`+panel;
    }
  } else if(cls) panel='<div class="small mut">No students in this class yet.</div>';
  return `<div class="card mt2"><h3>⚡ Quick payment — stream → class → student</h3>
  <div class="flex wrap">
    <div><label>Stream</label><select style="width:170px" onchange="CQ.stream=this.value;CQ.cls='';CQ.stu='';render()">
      ${streams.map(x=>`<option ${CQ.stream===x?'selected':''}>${x}</option>`).join('')}</select></div>
    <div><label>Class</label><select style="width:170px" onchange="CQ.cls=this.value;CQ.stu='';render()">
      ${sCls.map(c=>`<option value="${c.id}" ${CQ.cls===c.id?'selected':''}>${esc(c.name)}</option>`).join('')}</select></div>
    <div><label>Student</label><select style="width:260px" onchange="CQ.stu=this.value;render()">
      ${studs.map(x=>`<option value="${x.id}" ${CQ.stu===x.id?'selected':''}>${esc(x.firstName)} ${esc(x.surname)} · ${esc(x.sid)}${x.canteenPlan? ' ('+x.canteenPlan+')':' · not enrolled'}</option>`).join('')}</select></div>
  </div>
  <div class="rc-band-light mt2" style="background:#f0f4ff">${panel}</div>
  </div>`;
}
A.ctSaveDaily=function(){

A.ctPlan=function(stId, plan){

  const lbl={weekly:'📆 weekly',monthly:'📅 monthly',termly:'🗓 termly'}[plan];
  toast(plan? `${st.firstName} subscribed — ${lbl} (accumulates daily rate × feeding days)` : `${st.firstName} removed from canteen`,'ok');
};
A.ctBulkPlan=function(plan){
  const s=mySchool(); const cls=classOf(s,CT.cls); if(!cls) return;
  activeStudents(s.id).filter(st=>st.classId===cls.id).forEach(st=>st.canteenPlan=plan);
  saveDB(); render(); toast(`All of ${cls.name} → ${plan} plan`,'gold');
};
A.ctPay=function(stId){
  const s=mySchool(); const year=yearSel();
  const st=DB.students.find(x=>x.id===stId); const plan=st.canteenPlan; if(!plan) return;
  const cls=classOf(s,st.classId);
  const daily=ctnDaily(s, cls.stream);
  const amt=r1(daily*ctPeriodDays(s,plan,year));
  if(!(amt>0)) return toast('Set the daily rate for '+cls.stream+' first','bad');
  const key=ctKey(plan,year);
  if(DB.canteenPay.some(p=>p.studentId===stId&&p.plan===plan&&p.period===key)) return toast('Already recorded for this period','bad');
  DB.canteenPay.push({id:uid('ctp'), schoolId:s.id, studentId:stId, classId:st.classId, className:cls.name, plan,
    period:key, periodLabel:ctPeriodLabel(plan,year), days:ctPeriodDays(s,plan,year), rate:daily,
    amount:amt, date:todayISO(), by:me().name, ts:Date.now()});
  saveDB(); render();
  toast(`Recorded ${ghs(amt)} = ${ghs(daily)}/day × ${ctPeriodDays(s,plan,year)} days (${plan}) — ${st.firstName} ${st.surname}`,'ok');
};
A.ctUndo=function(stId){
  const s=mySchool(); const year=yearSel();
  const st=DB.students.find(x=>x.id===stId);
  const key=ctKey(st.canteenPlan,year);
  DB.canteenPay=DB.canteenPay.filter(p=>!(p.studentId===stId&&p.plan===st.canteenPlan&&p.period===key));
  saveDB(); render(); toast('Canteen payment reversed','gold');
};
A.ctBulkPay=function(plan){
  const s=mySchool(); const year=yearSel();
  const cls=classOf(s,CT.cls); if(!cls) return;
  const daily=ctnDaily(s, cls.stream);
  if(!(daily>0)) return toast('Set the daily rate for '+cls.stream+' first','bad');
  const days=ctPeriodDays(s,plan,year); const amt=r1(daily*days);
  const key=ctKey(plan,year); let n=0;
  activeStudents(s.id).filter(st=>st.classId===cls.id && st.canteenPlan===plan).forEach(st=>{
    if(DB.canteenPay.some(p=>p.studentId===st.id&&p.plan===plan&&p.period===key)) return;
    DB.canteenPay.push({id:uid('ctp'), schoolId:s.id, studentId:st.id, classId:st.classId, className:cls.name, plan,
      period:key, periodLabel:ctPeriodLabel(plan,year), days, rate:daily,
      amount:amt, date:todayISO(), by:me().name, ts:Date.now()});
    n++;
  });
  saveDB(); render();
  toast(n? `Recorded ${n} × ${ghs(amt)} (${ghs(daily)}/day × ${days} days, ${plan}) for ${cls.name}` : 'All '+plan+' subscribers already paid for this period', n?'ok':'gold');
};

/* ---------- EXPENDITURE & CASH FLOW ---------- */

    <div class="stat ${feesIn-totalOut>=0?'g':'r'} click" data-tip="👁 Show cash balance computation — details" onclick="A.expDetail('bal')"><span class="si">⚖</span><div class="sl">Cash balance</div><div class="sv" style="font-size:1.3rem">${ghs(feesIn-totalOut)}</div></div>
  </div>
  <div class="grid g2">
    <div class="card"><h3>➕ Log spending</h3>
      <label>Item *</label><input id="ex-item" placeholder="e.g. Chalk & markers, PTA refreshment, repairs">
      <div class="frow c2">
        <div><label>Amount (GH₵) *</label><input id="ex-amt" type="number" min="0" step="0.01"></div>
        <div><label>Date *</label><input id="ex-date" type="date" value="${todayISO()}"></div>

      <button class="btn mt2" onclick="A.expAdd()">💾 Save expenditure</button>

  </div>
  <div class="card mt2"><h3>🧾 Expenditure log — ${year}</h3>
  <div class="table-wrap"><table><thead><tr><th>Date</th><th>Item</th><th>Recipient</th><th>Category</th><th>Amount</th><th>By</th><th></th></tr></thead><tbody>
  ${list.map(e=>`<tr><td class="small">${fmtD(e.date)}</td><td>${esc(e.item)}</td>
    <td><b>${esc(e.rcp||'—')}</b><div class="small mut">${esc(e.rph||'')}</div></td><td><span class="tag">${esc(e.cat)}</span></td>
    <td class="bad b">${ghs(e.amount)}</td><td class="small">${esc(e.by)}</td>

A.expAdd=function(){

A.moneyTap=function(kind){
  const s=mySchool(); const year=yearSel();
  const pays=DB.payments.filter(p=>p.schoolId===s.id&&p.year===year);
  const exps=DB.expenditure.filter(e=>e.schoolId===s.id&&e.year===year);
  let title='', data=[], hint='';
  if(kind==='fees'){ title='💵 Fees collected per class — '+year; hint='Tap a class bar — payments open <b>as a graph</b>, one bar per student.';
    const byCls={}; pays.forEach(p=>{ const st=DB.students.find(x=>x.id===p.studentId); const c=st?classOf(s,st.classId):null; const k=c?c.name:'(unknown)';
      byCls[k]=(byCls[k]||0)+p.amount; });
    data=Object.keys(byCls).sort().map(k=>({label:k, value:r1(byCls[k]), color:'#0f8a4d', onclick:"A.feesClassTap('"+k.replace(/'/g,'')+"')"})); }
  else if(kind==='exp'){ title='🧾 Spending per category — '+year; hint='Tap a category bar — the monthly breakdown opens <b>as a graph</b>.';
    const byC={}; exps.forEach(e=>byC[e.cat]=(byC[e.cat]||0)+e.amount);
    data=Object.keys(byC).sort().map(k=>({label:k, value:r1(byC[k]), color:'#c62828', onclick:"A.expCatTap('','"+k.replace(/'/g,'')+"')"})); }
  else { title='⚖ Net cash per month — '+year; hint='Fees collected minus spending, month by month (green = surplus, red = deficit).';
    const mk={}; pays.forEach(p=>{const m=(p.date||'').slice(0,7); mk[m]=mk[m]||{f:0,e:0}; mk[m].f+=p.amount;});
    exps.forEach(e=>{const m=(e.date||'').slice(0,7); mk[m]=mk[m]||{f:0,e:0}; mk[m].e+=e.amount;});
    data=Object.keys(mk).sort().map(m=>{ const net=r1(mk[m].f-mk[m].e);
      return {label:m.slice(5)+'/'+m.slice(2,4), value:Math.max(net,0.01), disp:net, color:net>=0?'#0f8a4d':'#c62828'}; }); }
  openModal(`${mHead(title, true)}<div class="m-body">
  <div class="small mut mb1">${hint}</div>
  ${data.length? barChartSVG(data,{money:1}) : emptyMini('Nothing recorded yet for '+year+'.')}</div>
  <div class="m-foot"><button class="btn" onclick="A.closeModal()">Close</button></div>`);
};
A.feesClassTap=function(clsName){
  const s=mySchool(); const year=yearSel();
  const bySt={};
  DB.payments.filter(p=>p.schoolId===s.id&&p.year===year).forEach(p=>{ const st=DB.students.find(x=>x.id===p.studentId); const c=st?classOf(s,st.classId):null;
    if(!c||c.name!==clsName) return; bySt[st.id]=bySt[st.id]||{st, amt:0}; bySt[st.id].amt=r1(bySt[st.id].amt+p.amount); });
  const rows=Object.values(bySt).sort((a,b)=>cmpStudents(a.st,b.st));
  const data=rows.map(r=>({label:(r.st.firstName[0]||'')+'. '+r.st.surname, value:r.amt, color:'#0f8a4d'}));
  openModal(`${mHead('💵 '+esc(clsName)+' — payments per student ('+year+')', true)}<div class="m-body">

  <div class="m-foot"><button class="btn ghost" onclick="A.moneyTap('fees')">← Back</button>
  <button class="btn" onclick="A.closeModal()">Close</button></div>`);
};
/* tap a month bar → that month's spending by category, AS A GRAPH; tap a category → items as a graph */
A.expMonthTap=function(mk){
  const s=mySchool(); const year=yearSel();
  const list=DB.expenditure.filter(e=>e.schoolId===s.id&&e.year===year&&(e.date||'').slice(0,7)===mk);

A.expCatTap=function(mk, cat){

  openModal(`${mHead(title, true)}<div class="m-body">

/* detail popups behind the three clickable cash-flow cards */
A.expDetail=function(kind){
  const s=mySchool(); const year=yearSel();
  const pays=DB.payments.filter(p=>p.schoolId===s.id&&p.year===year).slice().sort((a,b)=>b.ts-a.ts);
  const exps=DB.expenditure.filter(e=>e.schoolId===s.id&&e.year===year).slice().sort((a,b)=>b.date.localeCompare(a.date));
  const feesIn=pays.reduce((a,p)=>a+p.amount,0), totalOut=exps.reduce((a,e)=>a+e.amount,0);
  let body='';
  if(kind==='fees'){
    const byM={}; pays.forEach(p=>byM[p.method]=(byM[p.method]||0)+p.amount);
    const rows=pays.slice(0,14).map(p=>{ const st=DB.students.find(x=>x.id===p.studentId);
      return `<tr><td class="small">${fmtD(p.date)}</td><td>${st?esc(st.firstName+' '+st.surname):'—'}</td><td class="small">${esc(p.method)}</td><td class="b">${ghs(p.amount)}</td></tr>`;}).join('');
    body=`<h4>💵 Fees collected — ${year} · <b>${ghs(feesIn)}</b></h4>
      <div class="mb1">${Object.entries(byM).map(([m,v])=>`<span class="tag">${esc(m)}: ${ghs(r1(v))}</span>`).join(' ')||'<span class="mut small">No payments yet.</span>'}</div>
      <div class="table-wrap"><table><thead><tr><th>Date</th><th>Student</th><th>Method</th><th>Amount</th></tr></thead><tbody>${rows||'<tr><td colspan="4" class="center mut">No payments recorded yet.</td></tr>'}</tbody></table></div>
      ${pays.length>14?`<div class="small mut mt1">…showing latest 14 of ${pays.length} receipts.</div>`:''}`;
  } else if(kind==='exp'){
    const byC={}; exps.forEach(e=>byC[e.cat]=(byC[e.cat]||0)+e.amount);
    const rows=exps.slice(0,14).map(e=>`<tr><td class="small">${fmtD(e.date)}</td><td>${esc(e.item)}</td><td class="small">${esc(e.rcp||'—')}<div class="small mut">${esc(e.rph||'')}</div></td><td><span class="tag">${esc(e.cat)}</span></td><td class="bad b">${ghs(e.amount)}</td></tr>`).join('');
    body=`<h4>🧾 Total expenditure — ${year} · <b>${ghs(totalOut)}</b></h4>
      <div class="mb1">${Object.entries(byC).map(([c,v])=>`<span class="tag">${esc(c)}: ${ghs(r1(v))}</span>`).join(' ')||'<span class="mut small">Nothing logged yet.</span>'}</div>
      <div class="table-wrap"><table><thead><tr><th>Date</th><th>Item</th><th>Recipient</th><th>Category</th><th>Amount</th></tr></thead><tbody>${rows||'<tr><td colspan="5" class="center mut">No spending logged yet.</td></tr>'}</tbody></table></div>
      ${exps.length>14?`<div class="small mut mt1">…showing latest 14 of ${exps.length} records.</div>`:''}`;
  } else {
    const months={}; pays.forEach(p=>{ const m=p.date.slice(0,7); months[m]=months[m]||{in:0,out:0}; months[m].in+=p.amount; });
    exps.forEach(e=>{ const m=e.date.slice(0,7); months[m]=months[m]||{in:0,out:0}; months[m].out+=e.amount; });
    const rows=Object.keys(months).sort().map(m=>{ const o=months[m]; return `<tr><td>${m.slice(5)}/${m.slice(2,4)}</td><td class="ok b">${ghs(r1(o.in))}</td><td class="bad b">${ghs(r1(o.out))}</td><td class="b ${o.in-o.out>=0?'ok':'bad'}">${ghs(r1(o.in-o.out))}</td></tr>`;}).join('');
    body=`<h4>⚖ Cash balance — ${year}</h4>
      <div class="kv mb2"><div>Fees collected</div><div class="ok b">+ ${ghs(r1(feesIn))}</div>
      <div>Total expenditure</div><div class="bad b">− ${ghs(r1(totalOut))}</div>
      <div><b>Cash balance</b></div><div class="b ${feesIn-totalOut>=0?'ok':'bad'}" style="font-size:1.15rem">= ${ghs(r1(feesIn-totalOut))}</div></div>
      ${rows?`<div class="table-wrap"><table><thead><tr><th>Month</th><th>In (fees)</th><th>Out (spending)</th><th>Balance</th></tr></thead><tbody>${rows}</tbody></table></div>`:'<div class="mut small">No transactions yet this year.</div>'}`;
  }
  openModal(`${mHead('💰 Cash-flow details — '+esc(mySchool().name))}<div class="m-body">${body}</div>
  <div class="m-foot"><button class="btn ghost" onclick="A.closeModal()">Close</button></div>`,{wide:true});
};
A.expDel=function(id){ if(!confirm('Delete this record?')) return; DB.expenditure=DB.expenditure.filter(e=>e.id!==id); saveDB(); render(); };
</script>

function renderReports(){

  const classes = u.role==='teacher'? [...teacherScope(u).ids].map(id=>classOf(s,id)).filter(Boolean)

function masterCopyData(s, cls, term, year){
  const subs=studentSubjectsForClass(s, cls);
  const studs=activeStudents(s.id).filter(st=>st.classId===cls.id);
  const rows=studs.map(st=>{
    const cells=subs.map(sub=>({sub, t:studentTotal(st.id,sub,term,year,cls.stream)}));
    let sum=0,n=0; cells.forEach(c=>{ if(c.t!==null){ sum+=c.t; n++; } });
    return {st, cells, agg:n? r1(sum):null, avg:n? r1(sum/n):null};
  });
  const scored=rows.filter(r=>r.agg!==null).sort((a,b)=> b.agg-a.agg || cmpStudents(a.st,b.st));
  scored.forEach((r,i)=>{ r.pos=i+1; });
  return {subs, rows:[...scored, ...rows.filter(r=>r.agg===null).sort((a,b)=>cmpStudents(a.st,b.st))]};
}

/* ============ Round-49: STAFF single-student report — print for ANY term even when the school's implemented term is different ============ */
A.studentReport=function(stId, preTerm){
  const u=me(); if(!u||(u.role!=='schooladmin'&&u.role!=='teacher')) return toast('Single-student report printing is for staff','bad');
  const s=mySchool(); const st=DB.students.find(x=>x.id===stId); if(!st) return;
  const c=classOf(s,st.classId); if(!c) return;
  if(u.role==='teacher' && !teacherScope(u).ids.has(c.id)) return toast('You can print reports only for your own classes','bad');
  const year=yearSel(); const terms=termsForClass(c); const active=currentTermName(s);
  openModal(`${mHead('🖨 Print report — '+esc(st.firstName)+' '+esc(st.surname||''))}<div class="m-body">
    <div class="notice info mini mb2">Print <b>ANY term</b> for this student — even while the school's implemented term is <b>⭐ ${esc(active)}</b>. Printing an off-term report changes nothing school-wide.</div>
    <div class="flex wrap" style="align-items:flex-end;gap:.6rem"><div><label>Term</label><select id="sr-term" style="width:150px">${terms.map(t=>`<option ${preTerm===t?'selected':''}>${t}</option>`).join('')}</select></div>
    <div id="sr-diff" class="grow"></div></div>
    <div id="sr-body" class="mt2"></div>
  </div><div class="m-foot"><button class="btn ghost" onclick="A.closeModal()">Close</button>
  <button class="btn gold" onclick="A.printStudentReport('${stId}')">🖨 Print this report</button></div>`,{wide:true});
  const upd=()=>{ const tm=$('#sr-term').value||preTerm||active;   // preTerm pre-selected (option 'selected' may not hydrate everywhere)
    $('#sr-body').innerHTML=reportCardHTML(s,c,st,tm,year);
    $('#sr-diff').innerHTML = tm!==active? `<div class="badge gold" data-tip="Off-term printing is allowed — active term unchanged">📄 ${esc(tm)} · school's term: ⭐ ${esc(active)}</div>`:''; };
  $('#sr-term').addEventListener('change',upd); upd();
};
A.printStudentReport=function(stId){
  if(featureBlocked('reportPrint')) return lockFeatureToast('Report Card printing');
  const u=me(); if(!u||(u.role!=='schooladmin'&&u.role!=='teacher')) return;
  const s=mySchool(); const st=DB.students.find(x=>x.id===stId); if(!st) return;
  const c=classOf(s,st.classId); if(!c) return;
  if(u.role==='teacher' && !teacherScope(u).ids.has(c.id)) return toast('You can print reports only for your own classes','bad');
  const tm=(($('#sr-term')||{}).value)||(termsForClass(c).includes(currentTermName(s))?currentTermName(s):termsForClass(c)[0]);
  if(picOverdue(st)){ openModal(`${mHead('🚫 Printing blocked', true)}<div class="m-body"><div class="notice bad">${picBlockMsg(st)}</div></div><div class="m-foot"><button class="btn" onclick="A.closeModal()">OK</button></div>`); return; }
  $('#print-root').innerHTML=reportCardHTML(s,c,st,tm,yearSel());
  toast(`Printing ${st.firstName}'s ${tm} report…`,'gold'); setTimeout(()=>window.print(),150);
};

/* Round-24: read the dominant colours of the uploaded school logo → becomes the report theme */
function extractLogoColors(dataUrl, cb){ try{
  const img=new Image();
  img.onload=()=>{ try{
    const N=32, cv=document.createElement('canvas'); cv.width=cv.height=N;
    const ctx=cv.getContext&&cv.getContext('2d'); if(!ctx) return cb(null);
    ctx.drawImage(img,0,0,N,N);
    const d=((ctx.getImageData&&ctx.getImageData(0,0,N,N))||{}).data||[]; const buckets={};
    for(let i=0;i+3<d.length;i+=4){ const r=d[i],g=d[i+1],b=d[i+2],a=d[i+3]; if(a<128) continue;
      const mx=Math.max(r,g,b), mn=Math.min(r,g,b);
      if(mx>240&&(mx-mn)<20) continue;                       /* ignore near-white background */
      const key=[Math.round(r/40),Math.round(g/40),Math.round(b/40)].join('|'); buckets[key]=(buckets[key]||0)+1; }
    const tops=Object.entries(buckets).sort((a,b)=>b[1]-a[1]); if(!tops.length) return cb(null);
    const toHex=k=>'#'+k.split('|').map(n=>Math.min(255,Math.round(+n*40+20)).toString(16).padStart(2,'0')).join('');
    const lum=k=>{const p=k.split('|').map(Number); return .299*p[0]+.587*p[1]+.114*p[2];};
    const cands=tops.slice(0,5).map(t=>t[0]);
    const dark=cands.slice().sort((a,b)=>lum(a)-lum(b))[0];                     /* primary = deepest tone  */
    const bright=cands.filter(c=>c!==dark).sort((a,b)=>lum(b)-lum(a))[0]||dark;  /* accent  = brightest tone */
    cb({ c1:toHex(dark), c2:toHex(bright) });
  }catch(e){ cb(null); } };
  img.onerror=()=>cb(null); img.src=dataUrl;
}catch(e){ cb(null); } }

let RSC_PH={n:1, shown:1, vals:[]};
function rsPhonesHTML(){
  let h='';

}
A.rsPhCount=function(v){ RSC_PH.n=Math.min(4,Math.max(1,parseInt(v,10)||1)); RSC_PH.shown=1;
  const el=$('#rs-phones'); if(el) el.innerHTML=rsPhonesHTML(); };
A.rsPhType=function(i,v){ RSC_PH.vals[i]=String(v||'').replace(/\D/g,'').slice(0,10);
  const el=$('#rs-ph-'+i); if(el&&el.value!==RSC_PH.vals[i]) el.value=RSC_PH.vals[i];
  if(RSC_PH.vals[i].length===10 && i+1<RSC_PH.n && RSC_PH.shown===i+1){ RSC_PH.shown=i+2;
    const box=$('#rs-phones'); if(box) box.innerHTML=rsPhonesHTML();
    const nx=$('#rs-ph-'+(i+1)); if(nx&&nx.focus) nx.focus(); } };
A.rsPhKey=function(i,ev){
  const k=(ev&&ev.key)||'';
  if(k!=='Tab'&&k!=='Enter') return true;
  const el=$('#rs-ph-'+i); if(el) RSC_PH.vals[i]=String(el.value||'').replace(/\D/g,'').slice(0,10);
  if((RSC_PH.vals[i]||'').length===10 && i+1<RSC_PH.n && RSC_PH.shown<i+2){ RSC_PH.shown=i+2;
    const box=$('#rs-phones'); if(box) box.innerHTML=rsPhonesHTML();
    const nx=$('#rs-ph-'+(i+1)); if(nx&&nx.focus) nx.focus(); }
  return k==='Tab';   /* Enter must NOT submit — it opens/hops to the next phone line */
};

function genJoinCode(name){
  /* SVMS-8472 style: initials of up to 4 words (else first 4 letters), dash, 4 digits — unique across all schools */
  const words=String(name||'').replace(/[^A-Za-z\s]/g,' ').trim().split(/\s+/).filter(Boolean);
  let base = words.length>=2 ? words.slice(0,4).map(w=>w[0]).join('') : (words[0]||'SCH').replace(/[^A-Za-z]/g,'').slice(0,4);
  base=base.toUpperCase(); while(base.length<3) base+='S';
  let code; do{ code=base+'-'+Math.floor(1000+Math.random()*9000); }while(DB.schools.some(s=>s.joinCode===code));
  return code;
}

  recordDeath('schools', id);

  const html=injectPortable(src, pack);

  const name=portableFileName(s);

  openModal(`${mHead('📦 Portable file ready — '+size, true)}<div class="m-body">

/* ---------- GOOGLE CALENDAR SYNC (ICS export) ---------- */
A.exportICS=function(){
  const s=mySchool();
  const dt=d=>d.replace(/-/g,'');
  const evs=[];
  s.terms.forEach(t=>{
    if(t.start) evs.push({d:t.start, sum:`${t.name} begins — ${s.name}`});
    if(t.end)   evs.push({d:t.end,   sum:`${t.name} ends — ${s.name}`});
    if(t.examStart) evs.push({d:t.examStart, sum:`${t.name} EXAMS begin — ${s.name}`});
    if(t.examEnd)   evs.push({d:t.examEnd,   sum:`${t.name} EXAMS end — ${s.name}`});
    (t.holidays||[]).forEach(h=>evs.push({d:h, sum:`Holiday (no school) — ${s.name}`}));
  });
  if(!evs.length) return toast('Set term/exam dates first (Attendance → Terms tab)','bad');
  const ics=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//HEREMS_PLUS//School Calendar//EN','CALSCALE:GREGORIAN']
    .concat(evs.map(e=>['BEGIN:VEVENT',`UID:${uid('ev')}@herems`,`DTSTART;VALUE=DATE:${dt(e.d)}`,
      `SUMMARY:${e.sum.replace(/[,;]/g,' ')}`,'END:VEVENT'].join('\r\n')))
    .concat(['END:VCALENDAR']).join('\r\n');
  const blob=new Blob([ics],{type:'text/calendar'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=(s.abbrev||'school')+'_calendar.ics'; a.click();
  openModal(`${mHead('📆 Google Calendar sync')}<div class="m-body">
    <div class="notice ok mini mb2">✔ Downloaded <b>${(s.abbrev||'school')}_calendar.ics</b> with ${evs.length} events (term dates, holidays, exam periods).</div>
    <b>To sync teachers' devices:</b>
    <ol class="mt1" style="padding-left:1.2rem;font-size:.9rem">
      <li>Open <b>calendar.google.com</b> → ⚙ Settings → <b>Import &amp; export</b>.</li>
      <li>Choose the downloaded <b>.ics</b> file → Import into your calendar.</li>
      <li>Events appear on every phone linked to that Google account.</li>
    </ol>
    <div class="small mut mt1">Tip: create a shared "School" calendar, import once, and share it with all teachers.</div>
  </div><div class="m-foot"><button class="btn" onclick="A.closeModal()">Done</button></div>`);
};

  const HOMETOWNS=['Accra, Greater Accra Region','Tema, Greater Accra Region','Kumasi, Ashanti Region','Obuasi, Ashanti Region','Tamale, Northern Region','Yendi, Northern Region',
    'Cape Coast, Central Region','Winneba, Central Region','Ho, Volta Region','Hohoe, Volta Region',
    'Koforidua, Eastern Region','Nkawkaw, Eastern Region','Sekondi-Takoradi, Western Region','Tarkwa, Western Region',
    'Sefwi Wiawso, Western North Region','Sunyani, Bono Region','Techiman, Bono East Region','Goaso, Ahafo Region',
    'Bolgatanga, Upper East Region','Wa, Upper West Region','Damongo, Savannah Region','Nalerigu, North East Region','Dambai, Oti Region'];
  const lastn=['Mensah','Asante','Boateng','Owusu','Agyei','Osei','Adjei','Darko','Appiah','Tetteh'] ;
  const year=curYear();
  const target=[cls5, s.classes.find(c=>c.name==='Basic 9A'), s.classes.find(c=>c.name==='Basic 4'), s.classes.find(c=>c.name==='Kindergarten 2')];
  let seq=0;
  target.forEach((cls,ti)=>{
    for(let i=0;i<(ti<2?10:6);i++){
      seq++;
      const g=Math.random()<0.5?'M':'F';
      const st={ id:uid('st'), schoolId:s.id, sid:`HIS/25/${seq}/${g}`,
        firstName:firsts[Math.floor(Math.random()*firsts.length)], surname:lastn[Math.floor(Math.random()*lastn.length)],
        otherName:'', gender:g, dob:'2013-05-14', adm:'2025-09-05', classId:cls.id,
        houseId:null, parentPhone: ti===0&&i===0? '0244111222':'0244'+String(100000+seq),
        relationship:['Mother','Father','Guardian'][seq%3], residence:HOMETOWNS[seq%HOMETOWNS.length],
        guardianName:'Guardian '+lastn[seq%lastn.length], commModes:['Call','SMS'].slice(0,1+(seq%2)), nationality:'Ghanaian', religion:seq%4?'Christian':'Muslim',
        photo:null, pictureStatus: seq<=3? 'pending':'uploaded', pictureDeadline: seq<=3? addWorkingDays(todayISO(),5):null,
        archived:false, createdAt:Date.now()-seq*3600000, carried:null };
      DB.students.push(st);
      // scores term 1 & 2
      const subs=studentSubjectsForClass(s,cls);
      ['Term 1','Term 2'].forEach(tm=>{ if(!termsForClass(cls).includes(tm))return;
        subs.forEach(sub=>{ DB.scores[scoreKey(st.id,sub,tm,year)]={c:Math.round((20+Math.random()*28)*2)/2, e:Math.round((45+Math.random()*50)*2)/2}; });
        DB.attendance[attKey(st.id,year,tm)]=Math.max(30, expectedDays(s.terms.find(t=>t.name===tm))-Math.floor(Math.random()*8));
      });
      // fees
      if(!feeStruct(s,cls.id,year)) DB.feeStructures[`${s.id}|${cls.id}|${year}`]={items:[{name:'Tuition',amount:850},{name:'Books',amount:220},{name:'Maintenance',amount:80},{name:'Exam Fee',amount:60}]};
      const bill=billOf(st,year); const payAmt = Math.random()<0.35? bill : Math.round(bill*(0.3+Math.random()*0.5));
      DB.payments.push({id:uid('pay'), schoolId:s.id, studentId:st.id, year, amount:payAmt, method:'Cash',
        date:'2025-10-'+String(3+(seq%20)).padStart(2,'0'), receiptNo:nextReceiptNo(s), by:'Abena Mensah', ts:Date.now()});
      DB.comments[`${s.id}|${st.id}|${year}|Term 1`]={t:'Hardworking and punctual.', h:'A good result — keep it up.'};
    }
  });
  s.stuSeq={'25':seq};
  // gender-balanced house deployment for the demo school (pre-school excluded)
  const preIds=new Set(s.classes.filter(c=>c.stream==='Pre-school').map(c=>c.id));
  deployPool(s, DB.students.filter(st=>st.schoolId===s.id&&!preIds.has(st.classId)), s.houses[0].id);
  DB.expenditure.push(
    {id:uid('ex'), schoolId:s.id, year, item:'Chalk, markers & registers', amount:340, date:'2025-09-20', cat:'Teaching & Learning', by:'Abena Mensah', ts:Date.now()},
    {id:uid('ex'), schoolId:s.id, year, item:'Roof repairs — KG block', amount:1200, date:'2025-10-11', cat:'Maintenance', by:'Abena Mensah', ts:Date.now()},
    {id:uid('ex'), schoolId:s.id, year, item:'Electricity bill', amount:560, date:'2025-11-03', cat:'Utilities', by:'Abena Mensah', ts:Date.now()});
  DB.prefects.push({id:uid('pf'), schoolId:s.id, studentId:DB.students[0].id, title:'Head Boy'});
  DB.prefects.push({id:uid('pf'), schoolId:s.id, studentId:DB.students[1].id, title:'Head Girl'});
  DB.prefects.push({id:uid('pf'), schoolId:s.id, studentId:DB.students[1].id, title:'Library Prefect'});
  // canteen: daily rate per stream + weekly/monthly/termly plans
  s.canteenDaily={'Pre-school':6,'Lower Primary':7,'Upper Primary':8,'JHS':9};
  const wkKey='W:'+currentWeekISO(), mthKey='M:'+new Date().toISOString().slice(0,7), tmKey='T:'+year+':Term 1';
  const hols=allHolidaySet(s);
  const c5kids=DB.students.filter(x=>x.classId===cls5.id);
  c5kids.forEach((st,i)=>{ st.canteenPlan=['weekly','monthly','termly'][i%3]; });
  const seedCtn=(st)=>{ const plan=st.canteenPlan;
    const key=plan==='weekly'?wkKey:plan==='monthly'?mthKey:tmKey;
    const days=plan==='weekly'?countWeekdaysInWeek(currentWeekISO(),hols):plan==='monthly'?countWeekdaysInMonth(mthKey.slice(2),hols):expectedDays(s.terms[0]);
    const amt=r1(8*days);
    DB.canteenPay.push({id:uid('ctp'), schoolId:s.id, studentId:st.id, classId:cls5.id, className:cls5.name,
      plan, period:key, periodLabel:(plan==='weekly'?'week '+key.slice(2):plan==='monthly'?key.slice(2):'Term 1 '+year),
      days, rate:8, amount:amt, date:todayISO(), by:'Abena Mensah', ts:Date.now()}); };
  c5kids.filter(st=>st.canteenPlan==='weekly').slice(0,1).forEach(seedCtn);
  c5kids.filter(st=>st.canteenPlan==='monthly').slice(0,2).forEach(seedCtn);
  c5kids.filter(st=>st.canteenPlan==='termly').slice(0,2).forEach(seedCtn);
  // demo communication + events
  DB.messages.push(
    {id:uid('m'), schoolId:s.id, fromId:'root', fromName:'Super Administrator', fromRole:'superadmin', scope:'sa', toUserId:'',
      text:'👋 Welcome aboard! Your 3-month grace is active — record a payment before it ends to keep every module unlocked.', ts:Date.now()-2*864e5, read:[]},
    {id:uid('m'), schoolId:s.id, fromId:admin.id, fromName:'Abena Mensah', fromRole:'schooladmin', scope:'broadcast', toUserId:'',
      text:'📢 Team: mid-term score entry closes this Friday. Please finish your subjects on time — well done so far! 💪', ts:Date.now()-864e5, read:[]});
  const tdy=todayISO();
  DB.events.push(
    {id:uid('ev'), schoolId:s.id, title:'Mid-Term Tests Begin', date:addDaysISO(tdy,7), time:'08:00', location:'All Classrooms', desc:'All classes — invigilation rota at the staffroom notice board.', audience:'All', img:null, by:'Abena Mensah', ts:Date.now()},
    {id:uid('ev'), schoolId:s.id, title:'Inter-House Athletics', date:addDaysISO(tdy,21), time:'09:00', location:'School Park', desc:'Annual sports festival at the school park. Parents invited!', audience:'All', img:null, by:'Abena Mensah', ts:Date.now()},
    {id:uid('ev'), schoolId:s.id, title:'PTA General Meeting', date:addDaysISO(tdy,-14), time:'10:00', location:'School Hall', desc:'Termly parent-teacher association meeting (held last term).', audience:'Parents', img:null, by:'Abena Mensah', ts:Date.now()-20*864e5});
  notifySuper(`🏫 New school self-registered: <b>Herems International School</b> (Kumasi) — code <b>HER-2026</b>.`);
  saveDB();
  showAuth('login');
  toast('✅ <b>Demo Mode Activated</b>','gold');   // Round-51: no credentials are revealed — activation message only
};

/* ---------- BOOT ---------- */
loadDB();
const PORTABLE_BOOT=loadPortableIfAny();   /* Round-80: a portable school .html carries its data INSIDE itself — absorb BEFORE anything renders */
const EMBEDDED_CLIENT=loadEmbeddedClientIfAny();   /* Round-83: a .html CLIENT file routes straight into join/setup (must not be bounced back to login) */
if('serviceWorker' in navigator){ try{ navigator.serviceWorker.register('sw.js').catch(()=>{}); }catch(e){} }
(function init(){
  const s=sess();
  if(s && me() && Date.now()-s.lastActivity < IDLE_LIMIT_MS){ touch(); boot(); } // session persistence: refresh keeps you in place
  else if(EMBEDDED_CLIENT){ if(s) DB.session=null, saveDB(); }   /* client file already rendered the join/admin step — leave it */
  else { if(s) DB.session=null, saveDB(); if(!silentAutoLogin()) showAuth('login'); }   // Round-43: device login opens the portal directly
  if(PORTABLE_BOOT) setTimeout(function(){ try{ toast(PORTABLE_BOOT.absorbed? ('📦 <b>'+esc(PORTABLE_BOOT.school)+'</b> portable data loaded — sign in as usual; ☁ sync stays live.') : ('ℹ️ This device already has <b>'+esc(PORTABLE_BOOT.school)+'</b> — your live-synced data is the freshest, so nothing was overlaid.'), PORTABLE_BOOT.absorbed?'gold':'ok'); }catch(e){} }, 1200);
  const VAULT_BOOT=loadVaultIfAny();   /* Round-89: double-clicked a backup/archive .html → OFFER the restore (never surprise-apply) */
  if(VAULT_BOOT) setTimeout(function(){ try{
    let vk='backup'; try{ vk=(JSON.parse(VAULT_BOOT.payload)||{}).kind||'backup'; }catch(e){}
    const u=me(); const label=VAULT_BOOT.label||('vault-'+(new Date(VAULT_BOOT.stamp||Date.now())).toISOString().slice(0,10)+'.html');
    if(u&&u.role==='superadmin'){ vk==='year-archive'? A.applyYearArchiveText(VAULT_BOOT.payload, label) : A.applyBackupText(VAULT_BOOT.payload, label); }
    else toast('📦 <b>Vault file opened</b> — it holds a HEREMS_PLUS '+(vk==='year-archive'?'year archive':'backup')+'. Sign in as Super Admin, then ☁️ Sync → 📂 Restore and pick this same file.','gold');
  }catch(e){} }, 1600);
})();
</script>
