<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0c3b20">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="HEREMS+">
<title>HEREMS_PLUS — School Management System</title>
<link rel="manifest" href="manifest.webmanifest">
<!-- Round-50: the APP ICON + HEREMS+ name must be used when the app is saved / added to home screen / installed -->
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="HEREMS+">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="./icons/icon-192.png">
<style>
/* ============ HEREMS_PLUS THEME ============ */
:root{
  --brand:#14532d; --brand2:#1b6b3a; --gold:#d97706; --gold2:#b45309;
  --bg:#f6f4ee; --card:#ffffff; --ink:#232119; --mut:#57534a; --line:#e3ded0;
  --ok:#0f8a4d; --okbg:#e5f6ec; --bad:#c62828; --badbg:#fdeaea; --warn:#b26a00; --warnbg:#fff3dd;
  --info:#123a8f; --infobg:#e6eeff; --radius:14px; --shadow:0 1px 2px rgba(35,33,25,.06),0 12px 28px -20px rgba(35,33,25,.4);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:"Segoe UI",system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
/* Round-87: human, crafted reading — serif display headings (Georgia is on every device), crisp 16px text */
h1,h2,.login-hero .lh-title,#topbar .tb-title,.card h3,.m-head b{font-family:Georgia,"Times New Roman",serif;letter-spacing:.01em}
.hidden{display:none!important}
a{color:var(--brand2)}
h1,h2,h3,h4{line-height:1.25}
.mut{color:var(--mut)} .small{font-size:.88rem} .b{font-weight:700} .center{text-align:center}
.gold{color:var(--gold2)} .ok{color:var(--ok)} .bad{color:var(--bad)}
.mt1{margin-top:.5rem}.mt2{margin-top:1rem}.mt3{margin-top:1.5rem}.mb1{margin-bottom:.5rem}.mb2{margin-bottom:1rem}.mb3{margin-bottom:1.5rem}
.flex{display:flex;align-items:center;gap:.6rem}.between{justify-content:space-between}.wrap{flex-wrap:wrap}.grow{flex:1}
.grid{display:grid;gap:1rem}
.g2{grid-template-columns:repeat(2,1fr)} .g3{grid-template-columns:repeat(3,1fr)} .g4{grid-template-columns:repeat(4,1fr)}
@media(max-width:1000px){.g4{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(2,1fr)}}
@media(max-width:640px){.g2,.g3,.g4{grid-template-columns:1fr}}

/* ============ AUTH ============ */
#auth-root{min-height:100vh;display:flex}
.auth-left{flex:1.1;background:#0c3b20;background-image:repeating-linear-gradient(135deg,rgba(255,255,255,.014) 0 2px,transparent 2px 9px);color:#fff;padding:2.4rem 3rem;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;position:relative;overflow:hidden}
.auth-left::after{content:"";position:absolute;right:-120px;bottom:-120px;width:360px;height:360px;border-radius:50%;background:rgba(245,166,35,.15)}
.auth-left::before{content:"";position:absolute;left:-80px;top:-80px;width:260px;height:260px;border-radius:50%;background:rgba(255,255,255,.06)}
.brandline{display:flex;align-items:center;gap:.9rem;margin-bottom:2rem}
.brandline .logo{width:58px;height:58px}
.auth-left h1{font-size:2.2rem;letter-spacing:.5px}
.auth-left h1 span{color:var(--gold)}
.auth-feats{margin-top:1.6rem;display:grid;gap:.7rem;font-size:.98rem;color:#dbead9}
.auth-feats div{display:flex;gap:.6rem;align-items:center}
.auth-right{flex:1;display:flex;align-items:center;justify-content:center;padding:2rem;background:var(--bg)}
.auth-card{width:100%;max-width:460px;background:var(--card);border-radius:18px;box-shadow:var(--shadow);padding:2rem}
.auth-card h2{margin-bottom:.2rem}
/* Round-66: live central-database status strip under the auth card */
.auth-cloud{margin-top:1rem;padding-top:.6rem;border-top:1px dashed var(--line);font-size:.79rem;color:var(--mut);text-align:center;line-height:1.5}
/* Round-62: colourful, center-aligned welcome hero on the login card */
.login-hero{text-align:center;margin-bottom:.55rem}
.login-hero .lh-title{margin-bottom:.1rem;font-size:1.42rem;letter-spacing:.01em}
.login-hero .lh-w{color:var(--bad)}
.login-hero .lh-b{color:var(--brand);font-weight:800;letter-spacing:.04em}
.login-hero .lh-p{color:var(--ok)}
.login-hero .lh-tag{font-size:.92rem;font-weight:800;font-style:italic;letter-spacing:.05em;color:var(--gold2)}
.rolepick{display:grid;gap:.7rem;margin-top:1.2rem}
.rolepick button{display:flex;align-items:center;gap:.9rem;padding:1rem;border:1.5px solid var(--line);border-radius:12px;background:#fbfcff;cursor:pointer;font-size:1rem;text-align:left;transition:.15s}
.rolepick button:hover{border-color:var(--brand2);background:#f3efe3}
.rolepick .ric{font-size:1.5rem}
.linkish{background:none;border:none;color:var(--brand2);cursor:pointer;font-size:.93rem;text-decoration:underline;padding:0}
@media(max-width:768px){.auth-left{display:none}}

/* ============ WIZARD ============ */
.steps{display:flex;gap:.4rem;margin:1rem 0 1.2rem}
.steps .st{flex:1;text-align:center;font-size:.78rem;color:var(--mut);padding-top:.5rem;position:relative}
.steps .st::before{content:"";position:absolute;top:0;left:0;right:0;height:4px;border-radius:4px;background:var(--line)}
.steps .st.on{color:var(--brand)}
.steps .st.on::before{background:var(--gold)}

/* ============ APP SHELL ============ */
#app{display:flex;min-height:100vh}
#sidebar{width:250px;background:#0c3b20;color:#cfe0cd;position:fixed;top:0;bottom:0;left:0;display:flex;flex-direction:column;z-index:40;transition:transform .2s}
#sidebar .s-brand{display:flex;align-items:center;gap:.6rem;padding:1.1rem 1.2rem;border-bottom:1px solid rgba(255,255,255,.08)}
#sidebar .s-brand .logo{width:38px;height:38px}
#sidebar .s-brand b{color:#fff;font-size:1.05rem;letter-spacing:.4px}
#sidebar .s-brand b span{color:var(--gold)}
#nav{flex:1;overflow-y:auto;padding:.7rem .6rem}
#nav .ni{display:flex;align-items:center;gap:.75rem;padding:.62rem .8rem;border-radius:10px;color:#cfe0cd;cursor:pointer;margin-bottom:2px;font-size:.96rem;position:relative}
#nav .ni:hover{background:rgba(255,255,255,.07);color:#fff}
#nav .ni.on{background:rgba(217,119,6,.18);color:#fff;border-left:3px solid var(--gold)}
#nav .ni .lk{margin-left:auto;font-size:.8rem}
#nav .sec{font-size:.74rem;text-transform:uppercase;letter-spacing:.12em;color:#8fae95;margin:1rem .8rem .3rem}
#sidebar .s-foot{padding:.9rem 1rem;border-top:1px solid rgba(255,255,255,.08);font-size:.82rem;color:#a9c2ab}
main{flex:1;margin-left:250px;display:flex;flex-direction:column;min-width:0}
#topbar{background:var(--card);border-bottom:1px solid var(--line);padding:.7rem 1.4rem;display:flex;align-items:center;gap:1rem;position:sticky;top:0;z-index:30}
#topbar .tb-title{font-weight:700;font-size:1.05rem}
/* Round-50: the topbar SHRINKS to fit every screen — title, countdown, install cue & menu never spill out of the bar */
#topbar>*{flex:none;min-width:0}
#topbar .tb-title{flex:0 1 auto;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#topbar .grow{flex:1 1 8px;min-width:4px}
@media(max-width:900px){#topbar .tb-sub{display:none}}
@media(max-width:768px){#topbar{padding:.5rem .7rem;gap:.5rem}#topbar .tb-title{font-size:.92rem}}
@media(max-width:620px){#topbar .tb-uname{display:none}#topbar .tb-user{padding:.3rem .45rem}#topbar{gap:.4rem}}
@media(max-width:480px){#topbar .tb-title{font-size:.82rem}.idle-chip{font-size:.66rem}}
#content{padding:1.5rem 1.7rem;max-width:none;width:100%;margin:0}
#burger{display:none;background:none;border:none;font-size:1.4rem;cursor:pointer}
@media(max-width:900px){
  #sidebar{transform:translateX(-100%)} #sidebar.open{transform:none;box-shadow:0 0 60px rgba(0,0,0,.4)}
  main{margin-left:0} #burger{display:block}
}

/* ============ COMPONENTS ============ */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:1.2rem}
.promo-card{text-align:center;transition:transform .15s,box-shadow .15s}
.promo-card:hover{transform:translateY(-3px);box-shadow:0 8px 20px rgba(0,51,102,.14)}
.promo-card .btn{width:100%}
.plan-card{text-align:center;cursor:pointer;transition:transform .15s,box-shadow .15s,border-color .15s;border:2px solid transparent}
.plan-card:hover{transform:translateY(-3px);box-shadow:0 8px 20px rgba(0,51,102,.16);border-color:var(--gold2)}
.pref-card{text-align:center;transition:transform .15s,box-shadow .15s}
.pref-card:hover{transform:translateY(-3px);box-shadow:0 8px 20px rgba(0,51,102,.14)}
.rm-pick{display:block;width:100%;margin-top:.25rem;padding:.3rem .45rem;font-size:.76rem;color:var(--mut)}
input[disabled]~.rm-pick{display:none}
/* round-18: term cards auto-fit (no horizontal slide before Term 3) */
.term-grid{display:grid;gap:1rem;grid-template-columns:repeat(auto-fit,minmax(235px,1fr))}
.term-card{padding:.85rem!important}
.term-card input{width:100%;min-width:0}
.term-exams{display:grid;grid-template-columns:1fr 1fr;gap:.4rem}
@media(max-width:480px){.term-exams{grid-template-columns:1fr}}
.term-pick{display:flex;align-items:center;gap:.45rem;font-weight:700;font-size:.86rem;color:#7c86a2;cursor:pointer;background:#fff;border:1.5px dashed #c3cdea;border-radius:10px;padding:.42rem .6rem;margin-bottom:.55rem;user-select:none}
.term-pick input{width:auto!important;min-width:0;transform:scale(1.2);accent-color:#15803d}
.term-pick.on{color:#15803d;border-style:solid;border-color:#15803d;background:#eafaf0}
.term-card.term-active{border:2.5px solid #15803d!important;box-shadow:0 6px 20px -8px rgba(21,128,61,.45)}
.term-card input:disabled{background:#f1f4fb;color:#9aa3b8;cursor:not-allowed}
/* compact teachers table (fits width — no horizontal scrollbar) */
.compact-tbl{font-size:.84rem}
.compact-tbl th,.compact-tbl td{padding:.4rem .5rem!important;white-space:normal;vertical-align:top}
.compact-tbl .tag{font-size:.66rem;padding:.08rem .35rem}
.pw-ciph{max-width:96px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:inline-block;vertical-align:middle}
/* clickable dashboard / stat cards */
.stat.click{cursor:pointer;transition:transform .15s,box-shadow .15s}
.stat.click:hover{transform:translateY(-3px);box-shadow:0 8px 20px rgba(0,51,102,.16)}
/* archive folders */
.arch-folder{flex:1;min-width:230px;cursor:pointer;border:2px solid transparent;transition:transform .15s,border-color .15s}
.arch-folder:hover{transform:translateY(-2px)}
.arch-folder.on{border-color:var(--gold2);box-shadow:0 8px 20px rgba(200,160,60,.18)}
.card h3{margin-bottom:.8rem}
.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:1.1rem 1.2rem;box-shadow:var(--shadow);position:relative;overflow:hidden}
.stat .sv{font-size:1.85rem;font-weight:800;margin-top:.15rem}
.stat .sl{font-size:.83rem;color:var(--mut);text-transform:uppercase;letter-spacing:.06em}
.stat .si{position:absolute;right:.9rem;top:.9rem;font-size:1.6rem;opacity:.85}
.stat::after{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--brand2)}
.stat.g::after{background:var(--gold)} .stat.g2::after{background:var(--ok)} .stat.r::after{background:var(--bad)}
.btn{display:inline-flex;align-items:center;gap:.45rem;background:var(--brand);color:#fff;border:none;padding:.6rem 1.1rem;border-radius:10px;font-size:.96rem;cursor:pointer;font-weight:600;transition:.15s;text-decoration:none}
.btn:hover{background:var(--brand2)}
.btn.gold{background:var(--gold);color:#3a2a00}.btn.gold:hover{background:var(--gold2);color:#fff}
.btn.ghost{background:#f0ede2;color:var(--ink);border:1px solid var(--line)}.btn.ghost:hover{background:#e6e1d2}
.btn.danger{background:var(--bad)}.btn.danger:hover{background:#a31f1f}
.btn.okb{background:var(--ok)}
.btn.sm{padding:.35rem .7rem;font-size:.84rem;border-radius:8px}
.btn.big{width:100%;justify-content:center;padding:.85rem;font-size:1rem}
.btn:disabled{opacity:.5;cursor:not-allowed}
input,select,textarea{width:100%;padding:.62rem .75rem;border:1.5px solid var(--line);border-radius:10px;font-size:1rem;font-family:inherit;background:#fff;color:var(--ink)}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--brand2);box-shadow:0 0 0 3px rgba(27,107,58,.16)}
label{display:block;font-size:.86rem;font-weight:650;color:#4a463e;margin:.75rem 0 .3rem}
label:first-child{margin-top:0}
.frow{display:grid;gap:1rem}
.frow.c2{grid-template-columns:1fr 1fr}.frow.c3{grid-template-columns:1fr 1fr 1fr}
@media(max-width:640px){.frow.c2,.frow.c3{grid-template-columns:1fr}}
.pw-wrap{position:relative}
.pw-wrap input{padding-right:2.6rem}
.eye{position:absolute;right:.5rem;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;font-size:1.05rem;color:var(--mut);padding:.2rem}
.checkline{display:flex;align-items:center;gap:.5rem;padding:.35rem 0}
.checkline input{width:auto}
.checkline.stayline{align-items:flex-start}
.checkline.stayline input{margin-top:.15rem;flex:none}
.checkline .stay-txt{flex:1 1 auto;min-width:0;white-space:normal;overflow-wrap:break-word;line-height:1.35}
.stream-group{border:1.5px solid var(--line);border-radius:12px;padding:.7rem .9rem;margin:.55rem 0;background:#fbfcff}
.stream-head{font-weight:700;color:var(--ink);margin-bottom:.3rem;display:flex;align-items:center;gap:.45rem;flex-wrap:wrap}
.stream-head .mut{font-weight:400}
.stream-subs-panel{margin:.45rem 0 .35rem .6rem;border-left:3px solid var(--gold);padding:.5rem .8rem;background:#fbf7ec;border-radius:0 10px 10px 0}
.stream-subs-panel:empty{display:none}
.badge{display:inline-flex;align-items:center;gap:.3rem;padding:.18rem .6rem;border-radius:999px;font-size:.77rem;font-weight:700}
.badge.ok{background:var(--okbg);color:var(--ok)} .badge.bad{background:var(--badbg);color:var(--bad)}
.badge.warn{background:var(--warnbg);color:var(--warn)} .badge.info{background:var(--infobg);color:var(--info)}
.badge.gold{background:#fdf0d3;color:#8a5b00}
.pill-lock{display:inline-flex;align-items:center;gap:.25rem;font-size:.74rem;font-weight:700;color:#8a5b00}
.table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--card)}
table{width:100%;border-collapse:collapse;font-size:.92rem;background:var(--card)}
th{background:#f4f2ea;text-align:left;padding:.65rem .8rem;font-size:.78rem;text-transform:uppercase;letter-spacing:.05em;color:var(--mut);border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:.6rem .8rem;border-bottom:1px solid #f1eee4;vertical-align:middle}
tr:last-child td{border-bottom:none}
tbody tr:hover{background:#faf8f0}
td input,td select{padding:.35rem .5rem;font-size:.9rem}
td input.score-in{width:70px}
.tag{display:inline-block;background:#f0ede2;border-radius:6px;padding:.1rem .45rem;font-size:.77rem;margin:1px}
.avatar{width:38px;height:38px;border-radius:50%;object-fit:cover;border:2px solid var(--line)}
.avatar.lg{width:64px;height:64px}
.av-fallback{width:38px;height:38px;border-radius:50%;background:var(--brand2);color:#fff;display:inline-flex;align-items:center;justify-content:center;font-weight:700;font-size:.85rem}
.av-fallback.lg{width:64px;height:64px;font-size:1.3rem}
.chart{width:100%;height:auto}
.notice{border-radius:10px;padding:.5rem .75rem;font-size:.84rem;display:flex;flex-wrap:wrap;gap:.15rem .4rem;align-items:flex-start;line-height:1.4;min-width:0;overflow-wrap:anywhere}
.notice.warn{background:var(--warnbg);color:#7a5200;border:1px solid #f0d9a8}
.notice.info{background:var(--infobg);color:#1c3f94;border:1px solid #c3d4f7}
.notice.bad{background:var(--badbg);color:#8c1d1d;border:1px solid #f2c1c1}
.notice.ok{background:var(--okbg);color:#0c6b3d;border:1px solid #b7e3c8}
.nh-path{border:1px solid var(--line);border-radius:14px;padding:.9rem 1rem;margin:.7rem 0;background:#fafbff}
.nh-path .nh-head{font-size:1rem;margin-bottom:.35rem}
.nh-path ol{margin:.2rem 0 .7rem;padding-left:1.2rem;color:var(--ink)}
.nh-path ol li{margin:.22rem 0;line-height:1.45}
.newhere-btn{background:var(--gold);border:none;border-radius:999px;color:#3a2600;cursor:pointer;font-weight:800;font-size:.92rem;padding:.6rem 1.3rem;box-shadow:0 3px 10px rgba(214,164,20,.35);transition:transform .15s}
.newhere-btn:hover{transform:translateY(-2px)}
.newhere-btn:active{transform:translateY(0)}
.tabs{display:flex;gap:.4rem;border-bottom:2px solid var(--line);margin-bottom:1.1rem;flex-wrap:wrap}
.tabs .tab{padding:.55rem 1rem;cursor:pointer;font-weight:600;font-size:.93rem;color:var(--mut);border-bottom:3px solid transparent;margin-bottom:-2px}
.tabs .tab.on{color:var(--brand);border-color:var(--gold)}

/* modal */
#modal-root{position:fixed;inset:0;z-index:100;display:none}
#modal-root.open{display:block}
.m-overlay{position:absolute;inset:0;background:rgba(10,14,32,.55);backdrop-filter:blur(2px)}
.m-card{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:#fff;border-radius:16px;box-shadow:0 20px 70px rgba(0,0,0,.35);width:min(560px,94vw);max-height:90vh;display:flex;flex-direction:column}
.m-card.wide{width:min(860px,96vw)}
.m-head{padding:1rem 1.3rem;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}
.m-head b{font-size:1.02rem}
.m-x{background:none;border:none;font-size:1.3rem;cursor:pointer;color:var(--mut)}
.m-body{padding:1.2rem 1.3rem;overflow-y:auto;overflow-x:auto}   /* Round-51: modal previews may slide sideways on tiny phones */
.m-foot{padding:.9rem 1.3rem;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:.6rem}
/* Round-19: previews shrink to occupy the space given */
.notice.mini{padding:.4rem .65rem;font-size:.8rem;border-radius:9px;gap:.3rem;line-height:1.35}
/* Round-59: every info/preview box packs INTO the space given to it — ONE shrink rule for ALL portals (SuperAdmin · School Admin · Teacher · Parent) */
.notice>span:first-of-type:not(.badge):not(.tag):not(.lk):not(.nav-badge){flex:1 1 12rem;min-width:0}
.nh-path{min-width:0;overflow-wrap:anywhere}
@media (max-width:720px){
  .notice{padding:.45rem .55rem;font-size:.8rem;gap:.1rem .3rem;line-height:1.35;border-radius:9px}
  .notice.mini{padding:.32rem .5rem;font-size:.76rem}
  .nh-path{padding:.6rem .65rem;margin:.5rem 0}
  .fp-grid{gap:.35rem}
}
/* Round-60: drill-down student rows, dashboard fee strip, print-friendly signatures */
.dd-stu{display:flex;align-items:center;gap:.6rem;padding:.45rem .55rem;border:1px solid var(--line);border-radius:10px;margin-bottom:.35rem;cursor:pointer;background:#fff;transition:border-color .12s,background .12s}
.dd-stu:hover{border-color:var(--gold);background:#fffbec}
.dd-strip{cursor:pointer;border-top:1px dashed var(--line);padding-top:.4rem;margin-top:.4rem}
.dd-strip:hover b{text-decoration:underline}
.sig-img{mix-blend-mode:multiply}   /* signature paper melts into whatever report template is PRINTED — dark strokes stay, white disappears */
@media print{ .sig-img{mix-blend-mode:multiply} }
/* Round-21: description boxes collapse into ONE line, tap to expand (houses/scores/canteen) */
.desc-strip{border:1px solid #c3d4f7;border-radius:10px;background:var(--infobg);margin-bottom:.8rem;font-size:.8rem;color:#1c3f94}
.desc-strip>summary{padding:.4rem .65rem;cursor:pointer;list-style:none;display:flex;gap:.4rem;align-items:center}
.desc-strip>summary::-webkit-details-marker{display:none}
.desc-strip>summary .ds-hint{margin-left:auto;font-weight:400;opacity:.7;white-space:nowrap}
.desc-strip[open]>summary{border-bottom:1px solid #c3d4f7}
.desc-strip .ds-body{padding:.45rem .65rem;line-height:1.4;display:flex;gap:.4rem;align-items:flex-start}
.m-body.tight{padding:.7rem .95rem}
.fp-grid{display:grid;gap:.45rem}
.fpr-card{border:1px solid #e3e8f4;border-radius:10px;padding:.55rem .7rem;background:#f7f9ff;margin-top:.6rem}
.fpr-row{display:flex;gap:.5rem;flex-wrap:wrap;margin-top:.4rem}
.fpr-row input{flex:1;min-width:170px;margin:0}
.pwrq{border:1px solid #f0d9a8;background:#fffdf5;border-radius:10px;padding:.45rem .65rem;display:flex;justify-content:space-between;align-items:center;gap:.6rem;flex-wrap:wrap;margin-bottom:.4rem}
@media (max-height:600px){.m-card{max-height:96vh}}

/* toasts */

/* ---------- modal ---------- */
function openModal(html, opts){
  const r=$('#modal-root'); r.classList.add('open');
  r.innerHTML=`<div class="m-overlay" onclick="A.closeModal(${opts&&opts.sticky?'event':'null'})"></div>

/* ---------- week / month day-count helpers (canteen daily rates) ---------- */
function isoD(d){ return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }
function currentWeekISO(){
  const d=new Date(); d.setHours(0,0,0,0);
  d.setDate(d.getDate()+3-((d.getDay()+6)%7));
  const week1=new Date(d.getFullYear(),0,4);
  const n=1+Math.round(((d.getTime()-week1.getTime())/86400000-3+((week1.getDay()+6)%7))/7);
  return `${d.getFullYear()}-W${String(n).padStart(2,'0')}`;
}
function weekMonday(weekStr){
  const [y,w]=String(weekStr).split('-W').map(Number);
  const jan4=new Date(y,0,4); const off=(jan4.getDay()+6)%7;
  const mon=new Date(jan4); mon.setDate(jan4.getDate()-off+(w-1)*7); return mon;
}
function countWeekdaysInWeek(weekStr, hols){
  const mon=weekMonday(weekStr); let n=0;
  for(let i=0;i<5;i++){ const d=new Date(mon); d.setDate(mon.getDate()+i); if(!hols.has(isoD(d))) n++; }
  return n;
}
function countWeekdaysInMonth(monthStr, hols){
  const [y,m]=String(monthStr).split('-').map(Number);
  const days=new Date(y,m,0).getDate(); let n=0;
  for(let i=1;i<=days;i++){ const d=new Date(y,m-1,i); const dow=d.getDay();
    if(dow>=1&&dow<=5&&!hols.has(isoD(d))) n++; }
  return n;
}

function studentTotal(studentId, subject, term, year, stream){
  const sc=getScore(studentId,subject,term,year); if(!sc) return null;
  return convertScore(sc.c, sc.e, stream).total;
}
function studentSubjectsForClass(school, cls){
  // subjects assigned to the class's stream in the subjects matrix
  const out=[];
  CORE_SUBJECTS.forEach(n=>{ if(((school.subjectStreams||{})[n]||[]).includes(cls.stream)) out.push(n); });
  (school.langs||[]).forEach(l=>{ if(((school.subjectStreams||{})[l]||[]).includes(cls.stream)) out.push(l); });
  (school.customSubjects||[]).forEach(n=>{ if(((school.subjectStreams||{})[n]||[]).includes(cls.stream)) out.push(n); });
  return out;
}
/* every subject offered in a class stream (from the subject→stream matrix) */
function streamSubjects(school, st){ return studentSubjectsForClass(school,{stream:st}); }
/* Aggregate = sum of converted totals across all subjects (spec § "Aggregate") */
function studentAggregate(studentId, cls, term, year){
  const school=DB.schools.find(s=>s.id===cls.schoolId); if(!school) return null;
  const subs=studentSubjectsForClass(school, cls);
  let sum=0, n=0;
  subs.forEach(sub=>{ const t=studentTotal(studentId, sub, term, year, cls.stream); if(t!==null){ sum+=t; n++; } });
  return n? { total:r1(sum), count:n } : null;
}
/* best-six aggregate: English, Maths, Science, Social Studies + best 2 others (sum, no division) */
function beceAggregate(studentId, cls, term, year){
  const school=DB.schools.find(s=>s.id===cls.schoolId); if(!school) return null;
  const subs=studentSubjectsForClass(school, cls);
  const totals=subs.map(sub=>({sub, t:studentTotal(studentId,sub,term,year,cls.stream)})).filter(x=>x.t!==null);
  if(!totals.length) return null;
  const core=[], others=[];
  totals.forEach(x=>{
    const low=x.sub.toLowerCase();
    if(BECE_CORE.some(k=>low.includes(k)) && core.length<4) core.push(x); else others.push(x);
  });
  others.sort((a,b)=>b.t-a.t);
  const chosen=[...core, ...others.slice(0, Math.max(0, 6-core.length))];
  if(chosen.length<6) return { chosen, total:r1(chosen.reduce((a,x)=>a+x.t,0)), partial:true };
  return { chosen, total:r1(chosen.reduce((a,x)=>a+x.t,0)), partial:false };
}
function classOf(school, classId){ return (school.classes||[]).find(c=>c.id===classId)||null; }
function genderLabel(g){ return (g==='M'||g==='Male')?'Male':(g==='F'||g==='Female')?'Female':'—'; }
/* canonical class order: stream order, then the pre-loaded ladder order (ord), then name */
function sortClasses(s){
  (s.classes||[]).forEach(c=>{ if(c.ord===undefined) c.ord=900+ (c.name||'').charCodeAt(0); });
  return (s.classes||[]).slice().sort((a,b)=>
    (STREAMS_ORDER.indexOf(a.stream)-STREAMS_ORDER.indexOf(b.stream)) ||
    ((a.ord??999)-(b.ord??999)) ||
    a.name.localeCompare(b.name,undefined,{numeric:true}));
}
function classStreams(school){ return STREAMS_ORDER.filter(st => (school.classes||[]).some(c=>c.stream===st)); }
function isBasic9(cls){ return cls && cls.stream==='JHS' && /^Basic 9/.test(cls.name); }
function isJHS(cls){ return cls && cls.stream==='JHS'; }   /* Round-35: best-six spans every JHS class (Basic 7-9) */
function termsForClass(cls){ return isBasic9(cls)? ['Term 1','Term 2'] : TERMS_ALL.slice(); }
/* canonical student order: ALPHABETICAL BY SURNAME, then first name, then other names (tie-break: student id);
   records missing a surname field derive it from the LAST word of the full name */
function cmpStudents(a,b){
  const key=st=>{
    let sn=st.surname, fn=st.firstName, on=st.otherName;
    if(!sn && !fn && st.name){ const parts=String(st.name).trim().split(/\s+/); sn=parts.length>1?parts[parts.length-1]:''; fn=parts[0]||''; on=parts.slice(1,-1).join(' '); }
    return (((sn||'')+' '+(fn||'')+' '+(on||'')).trim()||String(st.name||'')).toLowerCase();
  };
  return key(a).localeCompare(key(b), undefined, {sensitivity:'base'}) || String(a.sid||'').localeCompare(String(b.sid||''));
}
function sortStudents(list){ return (list||[]).slice().sort(cmpStudents); }
function activeStudents(schoolId){ return DB.students.filter(s=>s.schoolId===schoolId && !s.archived).sort(cmpStudents); }
function teachersOf(schoolId){ return DB.users.filter(u=>u.role==='teacher' && u.schoolId===schoolId && u.active!==false); }

/* ---------- fees / debt ---------- */
function feeStruct(school, classId, year){ return DB.feeStructures[`${school.id}|${classId}|${year}`] || null; }
function structTotal(school, classId, year){ const f=feeStruct(school,classId,year); return f? f.items.reduce((a,i)=>a+Number(i.amount||0),0):0; }
function carriedOf(student, year){ return (student.carried && student.carried.year===year)? Number(student.carried.amount||0) : 0; }
function billOf(student, year){
  const school=DB.schools.find(s=>s.id===student.schoolId); if(!school) return 0;
  return structTotal(school, student.classId, year) + carriedOf(student, year);
}
function paidOf(studentId, year){ return DB.payments.filter(p=>p.studentId===studentId && p.year===year).reduce((a,p)=>a+Number(p.amount||0),0); }
function balanceOf(student, year){ return r1(billOf(student,year) - paidOf(student.id, year)); }

/* full debt picture for one student: tuition/fees balance (split into carried-over vs this-year),
   plus the CURRENT canteen period if subscribed & unpaid. Total = fees + canteen. */
function debtBreakdown(school, st, year){
  const feesBalance = Math.max(0, balanceOf(st, year));
  const carriedPart = isStopped(st)? 0 : Math.min(feesBalance, carriedOf(st, year));
  let cant = 0, cantPlan = '';
  if(st.canteenPlan){
    const cls = classOf(school, st.classId);
    const daily = cls ? ctnDaily(school, cls.stream) : 0;
    const due = r1(daily * ctPeriodDays(school, st.canteenPlan, year));
    const paid = DB.canteenPay.some(p => p.studentId===st.id && p.plan===st.canteenPlan && p.period===ctKey(st.canteenPlan, year));
    if(due > 0 && !paid){ cant = due; cantPlan = st.canteenPlan; }
  }
  return { fees:r1(feesBalance), carried:r1(carriedPart), cant, cantPlan, total:r1(feesBalance+cant) };
}

/* ---------- attendance ---------- */
function expectedDays(term){
  if(!term || !term.start || !term.end) return 0;
  const hols=new Set(term.holidays||[]);
  let d=new Date(term.start+'T00:00:00'), end=new Date(term.end+'T00:00:00'), n=0;
  while(d<=end){ const dow=d.getDay(); const iso=d.toISOString().slice(0,10);
    if(dow>=1 && dow<=5 && !hols.has(iso)) n++; d.setDate(d.getDate()+1); }
  return n;
}
function attKey(studentId, year, termName){ return `${studentId}|${year}|${termName}`; }
function attOf(studentId, year, termName){ return DB.attendance[attKey(studentId,year,termName)] || 0; }

/* ---- Ghana time (Africa/Accra = GMT+0) ---- */
const GH_MONTHS={January:'01',February:'02',March:'03',April:'04',May:'05',June:'06',July:'07',August:'08',September:'09',October:'10',November:'11',December:'12'};
function ghParts(d){ const p={}; new Intl.DateTimeFormat('en-GB',{timeZone:'Africa/Accra',weekday:'long',year:'numeric',month:'long',day:'numeric',hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:true}).formatToParts(d||new Date()).forEach(x=>p[x.type]=x.value); return p; }
function ordSuffix(n){ const v=n%100; if(v>=11&&v<=13) return 'th'; return (n%10===1?'st':n%10===2?'nd':n%10===3?'rd':'th'); }
/* e.g. "Friday, 23rd May, 2026 - 02:30:45 PM" */
function ghClockText(d){ const p=ghParts(d), day=parseInt(p.day,10), dp=(p.dayPeriod||'').toUpperCase();
  return `${p.weekday}, ${day}${ordSuffix(day)} ${p.month}, ${p.year} - ${p.hour}:${p.minute}:${p.second} ${dp}`; }
function ghHour(d){ const p=ghParts(d); let h=parseInt(p.hour,10)%12; if((p.dayPeriod||'').toLowerCase()==='pm') h+=12; return h; }
function ghTodayISO(){ const p=ghParts(); return `${p.year}-${GH_MONTHS[p.month]}-${String(p.day).padStart(2,'0')}`; }

/* ---- working days (Mon-Fri) ---- */
function addDaysISO(iso,n){ const d=new Date(iso+'T00:00:00'); d.setDate(d.getDate()+n); return d.toISOString().slice(0,10); }
function addWorkingDays(iso,n){ const d=new Date(iso+'T00:00:00'); let a=0; while(a<n){ d.setDate(d.getDate()+1); const w=d.getDay(); if(w>=1&&w<=5) a++; } return d.toISOString().slice(0,10); }
function workingDaysLeft(deadlineIso,fromIso){ fromIso=fromIso||todayISO(); let n=0; const d=new Date(fromIso+'T00:00:00'), end=new Date(deadlineIso+'T00:00:00'); while(d<end){ d.setDate(d.getDate()+1); const w=d.getDay(); if(w>=1&&w<=5) n++; } return n; }

function loginGreeting(u){ if(!u||(u.role!=='schooladmin'&&u.role!=='teacher')) return null;
  const today=ghTodayISO(); const first=((u.name||'').trim().split(/\s+/)[0])||'there';
  const title=u.gender==='Female'?'Madam':(u.gender==='Male'?'Sir':''); let kind;
  if(u.lastLoginDate===today) kind='back';                       // CASE B: same-day return
  else { const h=ghHour(); kind=(h>=5&&h<12)?'morning':(h>=12&&h<17)?'afternoon':'evening'; }
  u.lastLoginDate=today; saveDB();                                // CASE A: stamp today's first login
  return {kind,title,first}; }
function greetingText(g){ const who=(g.title?g.title+' ':'')+g.first;
  if(g.kind==='back') return `Welcome Back, ${who}`;
  return (g.kind==='morning'?'Good Morning, ':g.kind==='afternoon'?'Good Afternoon, ':'Good Evening, ')+who; }

/* ---- UNIVERSAL TOOLTIP ENGINE (hover + long-press) ---- */
const EMOJI_TIPS={'✏️':'Edit','✏':'Edit','🗑':'Delete','🗑️':'Delete','🗄':'Archive','🗄️':'Archive','👁':'View details','👁️':'View details','🖨':'Print','🖨️':'Print','⏰':'Delay','⬇️':'Download','📥':'Download','⬇':'Download','⬆️':'Upload','⬆':'Upload','📤':'Export all','❌':'Close','✖':'Close','➕':'Add new','🔍':'Search','🖊':'Sign'};
function hpTipText(el){ if(!el||!el.getAttribute) return '';
  let t=el.getAttribute('data-tip'); if(t) return t;
  t=el.getAttribute('title'); if(t){ try{ el.setAttribute('data-tip',t); el.removeAttribute&&el.removeAttribute('title'); }catch(e){} return t; }
  t=el.getAttribute('aria-label'); if(t) return t;
  const txt=(el.textContent||'').trim();
  if(txt.length<=4){ for(const k in EMOJI_TIPS){ if(txt===k||txt.indexOf(k)===0) return EMOJI_TIPS[k]; } }
  return (txt && txt.length<=42)? txt : ''; }
function initTooltips(){ if(window.__tipInit) return; window.__tipInit=true;
  const tip=$('#hp-tip'); let cur=null, lpTimer=0;
  // tooltip hugs the cursor tightly: sits just below the pointer, flips above when near the screen bottom
  const place=(x,y)=>{ const w=tip.offsetWidth||120, h=tip.offsetHeight||26;
    const vw=window.innerWidth||900, vh=window.innerHeight||700;
    const p=tipBox(x,y,w,h,vw,vh); tip.style.left=p.left+'px'; tip.style.top=p.top+'px'; };
  const show=(t,x,y)=>{ tip.textContent=t; tip.classList.add('on'); place(x,y); };
  const hide=()=>{ tip.classList.remove('on'); cur=null; if(lpTimer){ clearTimeout(lpTimer); lpTimer=0; } };
  document.addEventListener('mouseover',e=>{ const el=e.target&&e.target.closest? e.target.closest('button,a.btn,.btn,.tab,[data-tip],[title]'):null;
    if(!el){ if(cur) hide(); return; } const t=hpTipText(el); if(!t){ hide(); return; } cur=el; show(t,e.clientX||30,e.clientY||30); });
  document.addEventListener('mousemove',e=>{ if(cur) place(e.clientX||30,e.clientY||30); });
  document.addEventListener('mouseout',e=>{ if(cur && !(e.relatedTarget&&cur.contains&&cur.contains(e.relatedTarget))) hide(); });
  document.addEventListener('click',hide);
  document.addEventListener('scroll',hide,true);
  document.addEventListener('touchstart',e=>{ const t0=e.touches&&e.touches[0]; const el=e.target&&e.target.closest? e.target.closest('button,.btn,[data-tip],[title]'):null; if(!el||!t0) return;
    lpTimer=setTimeout(()=>{ const t=hpTipText(el); if(t){ cur=el; show(t,t0.clientX,t0.clientY); } },500); },{passive:true});
  document.addEventListener('touchend',hide,{passive:true});
  document.addEventListener('touchmove',hide,{passive:true}); }
/* pure placement math (testable): tight under the cursor, flips above near the bottom edge */
/* Round-22: tooltip sits at the IMMEDIATE LEFT of the cursor when there is room — otherwise immediately UNDER it */
function tipBox(x,y,w,h,vw,vh){ w=w||120; h=h||26; vw=vw||900; vh=vh||700;
  if(x-w-10>=6) return {left:x-w-10, top:Math.min(Math.max(6, y-Math.round(h/2)), vh-h-8)};
  const L=Math.min(Math.max(6, x-14), vw-w-8); let T=y+8; if(T+h>vh-8) T=Math.max(6, y-h-8);
  return {left:L, top:T}; }

/* ---- CSV helpers ---- */
function csvEsc(v){ v=String(v==null?'':v); return /[",\n\r]/.test(v)? '"'+v.replace(/"/g,'""')+'"' : v; }
function toCSV(rows){ return rows.map(r=>r.map(csvEsc).join(',')).join('\r\n'); }
function csvParse(text){ const rows=[]; let row=[], cur='', inQ=false; text=String(text==null?'':text);
  for(let i=0;i<text.length;i++){ const ch=text[i];
    if(inQ){ if(ch==='"'){ if(text[i+1]==='"'){ cur+='"'; i++; } else inQ=false; } else cur+=ch; }
    else if(ch==='"') inQ=true;
    else if(ch===','){ row.push(cur); cur=''; }
    else if(ch==='\n'){ row.push(cur); rows.push(row); row=[]; cur=''; }
    else if(ch==='\r'){ /* skip */ }
    else cur+=ch; }
  if(cur!==''||row.length){ row.push(cur); rows.push(row); }
  return rows; }

/* ---- XLSX build (stored zip, Excel-compatible) & parse (stored or inflated) ---- */
const CRC_T=(()=>{ const t=[]; for(let n=0;n<256;n++){ let c=n; for(let k=0;k<8;k++) c=(c&1)?(0xEDB88320^(c>>>1)):(c>>>1); t[n]=c>>>0; } return t; })();
function crc32(u8){ let c=0xFFFFFFFF; for(let i=0;i<u8.length;i++) c=CRC_T[(c^u8[i])&0xFF]^(c>>>8); return (c^0xFFFFFFFF)>>>0; }
const TE=new TextEncoder(), TD=new TextDecoder();
function concatU8(parts){ let n=0; parts.forEach(p=>n+=p.length); const out=new Uint8Array(n); let o=0; parts.forEach(p=>{ out.set(p,o); o+=p.length; }); return out; }
function zipStore(files){ // files: [{name, data:Uint8Array}] — method 0 (stored)
  const chunks=[], central=[]; let offset=0;
  files.forEach(f=>{ const name=TE.encode(f.name), crc=crc32(f.data), size=f.data.length;
    const lh=new DataView(new ArrayBuffer(30));
    lh.setUint32(0,0x04034b50,true); lh.setUint16(4,20,true); lh.setUint32(14,crc,true);
    lh.setUint32(18,size,true); lh.setUint32(22,size,true); lh.setUint16(26,name.length,true);
    chunks.push(new Uint8Array(lh.buffer), name, f.data);
    const ch=new DataView(new ArrayBuffer(46));
    ch.setUint32(0,0x02014b50,true); ch.setUint16(4,20,true); ch.setUint16(6,20,true); ch.setUint32(16,crc,true);
    ch.setUint32(20,size,true); ch.setUint32(24,size,true); ch.setUint16(28,name.length,true); ch.setUint32(42,offset,true);
    central.push(new Uint8Array(ch.buffer), name);
    offset+=30+name.length+size; });
  const cdSize=central.reduce((a,c)=>a+c.length,0);
  const eocd=new DataView(new ArrayBuffer(22));
  eocd.setUint32(0,0x06054b50,true); eocd.setUint16(8,files.length,true); eocd.setUint16(10,files.length,true);
  eocd.setUint32(12,cdSize,true); eocd.setUint32(16,offset,true);
  return concatU8(chunks.concat(central,[new Uint8Array(eocd.buffer)])); }
function xmlEsc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function xlsxBuild(rows){ const sheetRows=rows.map((r,i)=>`<row r="${i+1}">`+r.map((c,j)=>{
    const col=String.fromCharCode(65+(j%26))+(j>=26?'A':''); const v=String(c==null?'':c);
    return v===''? '' : `<c r="${col}${i+1}" t="inlineStr"><is><t xml:space="preserve">${xmlEsc(v)}</t></is></c>`; }).join('')+'</row>').join('');
  const files=[
    {name:'[Content_Types].xml', data:TE.encode('<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/worksheets/sheet1.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/></Types>')},
    {name:'_rels/.rels', data:TE.encode('<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>')},
    {name:'xl/workbook.xml', data:TE.encode('<?xml version="1.0" encoding="UTF-8" standalone="yes"?><workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets><sheet name="Students" sheetId="1" r:id="rId1"/></sheets></workbook>')},
    {name:'xl/_rels/workbook.xml.rels', data:TE.encode('<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet1.xml"/></Relationships>')},
    {name:'xl/worksheets/sheet1.xml', data:TE.encode('<?xml version="1.0" encoding="UTF-8" standalone="yes"?><worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><sheetData>'+sheetRows+'</sheetData></worksheet>')}];
  return zipStore(files); }
function decodeXml(s){ return s.replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&quot;/g,'"').replace(/&#39;|&apos;/g,"'").replace(/&amp;/g,'&'); }
async function inflateRaw(u8){ if(typeof DecompressionStream==='undefined') throw 'compressed XLSX needs a modern browser — save as CSV and try again';
  const ds=new DecompressionStream('deflate-raw'); const stream=new Blob([u8]).stream().pipeThrough(ds);
  return new Uint8Array(await new Response(stream).arrayBuffer()); }
async function xlsxParse(buf){ const u8=buf instanceof Uint8Array? buf : new Uint8Array(buf);
  const dv=new DataView(u8.buffer, u8.byteOffset, u8.byteLength);
  let e=-1; for(let i=u8.length-22;i>=0;i--){ if(dv.getUint32(i,true)===0x06054b50){ e=i; break; } }
  if(e<0) throw 'Not a valid Excel (.xlsx) file';
  const n=dv.getUint16(e+10,true); let off=dv.getUint32(e+16,true); const files={};
  for(let i=0;i<n;i++){ if(dv.getUint32(off,true)!==0x02014b50) break;
    const method=dv.getUint16(off+10,true), csize=dv.getUint32(off+20,true), size=dv.getUint32(off+24,true),
      nl=dv.getUint16(off+28,true), el=dv.getUint16(off+30,true), cl=dv.getUint16(off+32,true), lhOff=dv.getUint32(off+42,true);
    const name=TD.decode(u8.slice(off+46,off+46+nl));
    const fnl=dv.getUint16(lhOff+26,true), fel=dv.getUint16(lhOff+28,true);
    const start=lhOff+30+fnl+fel; let data=u8.slice(start,start+csize);
    data = method===8? await inflateRaw(data) : data.slice(0,size);
    files[name]=data; off+=46+nl+el+cl; }
  const shared=[];
  if(files['xl/sharedStrings.xml']){ const xml=TD.decode(files['xl/sharedStrings.xml']);
    const re=/<si>([\s\S]*?)<\/si>/g; let m; while((m=re.exec(xml))){ shared.push(decodeXml(m[1].replace(/<[^>]+>/g,''))); } }
  const sheetName=Object.keys(files).find(k=>/^xl\/worksheets\/sheet\d+\.xml$/.test(k))||'xl/worksheets/sheet1.xml';
  if(!files[sheetName]) throw 'No worksheet found in this file';
  const xml=TD.decode(files[sheetName]);
  const rows=[]; const rowRe=/<row[^>]*>([\s\S]*?)<\/row>/g; let rm;
  while((rm=rowRe.exec(xml))){ const cells=[]; const cRe=/<c\b([^>]*?)(?:\/>|>([\s\S]*?)<\/c>)/g; let cm, colIdx=0;
    while((cm=cRe.exec(rm[1]))){ const attrs=cm[1]||'', inner=cm[2]||'';
      const rM=/r="([A-Z]+)\d+"/.exec(attrs); let idx=colIdx;
      if(rM){ idx=0; for(const ch2 of rM[1]) idx=idx*26+(ch2.charCodeAt(0)-64); idx--; }
      const tM=/t="(\w+)"/.exec(attrs); const t=tM?tM[1]:''; let v='';
      if(t==='s'){ const vM=/<v>(\d+)<\/v>/.exec(inner); v=vM?(shared[parseInt(vM[1],10)]||''):''; }
      else if(t==='inlineStr'){ const t2=/<t[^>]*>([\s\S]*?)<\/t>/.exec(inner); v=t2?decodeXml(t2[1]):''; }
      else { const vM=/<v>([\s\S]*?)<\/v>/.exec(inner); v=vM?decodeXml(vM[1]):''; }
      while(cells.length<idx) cells.push('');
      cells[idx]=v; colIdx=idx+1; }
    rows.push(cells); }
  return rows; }
/* Round-70: keep blob URLs alive LONG — mobile browsers often start reading the file seconds after the click;
   revoking early (or after 100ms) kills the download before it begins. */
function downloadFile(name, mime, data){ try{ const blob=new Blob([data],{type:mime}); const url=URL.createObjectURL(blob);
  const a=document.createElement('a'); a.href=url; a.download=name; document.body.appendChild(a); a.click();
  setTimeout(()=>{ try{ URL.revokeObjectURL(url); a.remove(); }catch(e){} },6000); }catch(e){ toast('Download blocked on this device','bad'); } }
/* Round-70: clipboard with a graceful legacy fallback — chat webviews often deny navigator.clipboard */
function legacyCopy(t){ try{ const ta=document.createElement('textarea'); ta.value=String(t); ta.setAttribute('readonly','');
  ta.style.position='fixed'; ta.style.left='-9999px'; (document.body||document.documentElement).appendChild(ta);
  ta.select&&ta.select(); const ok=(typeof document.execCommand==='function')&&document.execCommand('copy'); ta.remove&&ta.remove(); return !!ok; }catch(e){ return false; } }
function copyText(t, onOk, onBad){ const fin=function(ok){ if(ok){ if(onOk)onOk(); } else if(onBad)onBad(); return !!ok; };
  try{ if(typeof navigator!=='undefined'&&navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(String(t)).then(function(){ fin(true); },function(){ fin(legacyCopy(t)); });
    return true; } }catch(e){}
  return fin(legacyCopy(t)); }

/* Round-66: LIVE central-database status strip on every auth screen — instantly shows whether THIS device
   can see the cloud (and how many schools are registered there). Turns "it doesn't sync" into visible truth. */
async function probeCloudStatus(){
  const set=function(h){ const el=$('#auth-cloud'); if(el) el.innerHTML=h; };
  if(!syncOnline()) return set('☁️ central database: <b>offline</b> — codes & login validate from this device only');
  const c=syncCfg();
  try{
    const r=await fetch('https://api.jsonbin.io/v3/b/'+encodeURIComponent(c.bin)+'/latest?t='+Date.now(), { cache:'no-store', headers:{ 'X-Master-Key':c.mk, 'X-Bin-Meta':'false' } });
    if(!(r&&r.ok)) throw new Error('HTTP '+((r&&r.status)||'?'));
    const j=await r.json(); const rec=await unpackBinRec(j); const data=rec&&rec.data;   // Round-77: packed OR raw OR wrapped
    if(!data||!data.settings) return set('☁️ central database: <b>empty</b> — register your school, then this line counts it');
    const n=(data.schools||[]).length; const ts=new Date(Number(rec.stamp||Date.now()));
    set('☁️ central database: <b>connected ✅</b> — <b>'+n+'</b> school'+(n===1?'':'s')+' registered · last update '
      +ts.toLocaleDateString('en-GB',{day:'2-digit',month:'short'})+' '+ts.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'}));
  }catch(e){ const m=String((e&&e.message)||e);
    set('☁️ central database: <b>unreachable ⚠</b> ('+esc(m)+') — check internet'
      +(/\bHTTP (401|403)\b/.test(m) ? ' · <button class="linkish" onclick="A.useDefaultSyncCfg()" style="font-size:inherit">🔧 repair to the default connection</button>'   // Round-69: pre-login key repair — a locked-out device can fix its own keys
                                        : ' · then Settings → Cloud keys')); }
}

/* Stream-grouped subject-teacher picker:

function streamClassPickerHTML(s, classes, inApp, excludeId){
  const d=REG.data;
  const list=classes.filter(c=>c.id!==excludeId);
  if(!list.length) return '<div class="notice info mt2">No other classes available.</div>';
  const anyPicked=(d.scPicks||[]).some(id=>id!==excludeId);
  let h=`<div class="mt2"><div class="notice info">🗂 Tick any number of <b>class streams / classes</b> below — for every class you tick, the <b>subjects offered in that stream</b> open up underneath it: choose a <b>single subject or more</b>.</div>`;
  classStreams(s).forEach(st=>{
    const cls=list.filter(c=>c.stream===st); if(!cls.length) return;
    const stSubs=streamSubjects(s, st);
    h+=`<div class="stream-group"><div class="stream-head">🎓 ${st} <span class="badge info">${cls.length} class${cls.length>1?'es':''}</span>
      <span class="mut small">offers ${stSubs.length} subject${stSubs.length===1?'':'s'}: ${stSubs.map(esc).join(', ')||'—'}</span></div>
      <div class="grid g3">${cls.map(c=>{
        const on=(d.scPicks||[]).includes(c.id);
        return `<div class="checkline"><input type="checkbox" class="tr-sc" value="${c.id}" ${on?'checked':''} onchange="A.harvestTR();A.tScToggle('${c.id}',this.checked,${inApp?'1':''})"><span><b>${esc(c.name)}</b></span></div>`;
      }).join('')}</div>`;
    cls.filter(c=>(d.scPicks||[]).includes(c.id)).forEach(c=>{
      const subs=streamSubjects(s, c.stream);
      const chosen=(d._byId||{})[c.id]||[];
      h+=`<div class="stream-subs-panel"><div class="b mb1" style="color:var(--ink)">✏ Subject(s) you teach in ${esc(c.name)} <span class="tag">${c.stream}</span></div>
        ${subs.length?`<div class="grid g3">${subs.map(x=>`<div class="checkline"><input type="checkbox" class="tr-sbj-${c.id}" value="${esc(x)}" ${chosen.includes(x)?'checked':''}><span>${esc(x)}</span></div>`).join('')}</div>`
        :'<div class="mut small">⚠ No subjects assigned to this stream yet — the school admin sets them under Subjects → stream matrix.</div>'}</div>`;
    });
    h+='</div>';
  });
  if(!anyPicked) h+='<div class="mut small mt1">☝ Nothing selected yet — tick one or more classes above.</div>';
  return h+'</div>';
}

/* ---------- SVG CHARTS (no external libs) ---------- */
function lineChartSVG(points, opts){
  opts=opts||{}; const W=720,H=240,P=42;
  const vals=points.map(p=>p.value); const max=Math.max(10,...vals)*1.12, min=0;
  const X=i=> points.length===1? W/2 : P+(W-2*P)*i/(points.length-1);
  const Y=v=> H-P-(H-2*P)*(v-min)/(max-min);
  let grid=''; for(let g=0;g<=4;g++){ const v=min+(max-min)*g/4, y=Y(v);
    grid+=`<line x1="${P}" y1="${y}" x2="${W-P}" y2="${y}" stroke="#ccd4e6" stroke-width="1.2"/>
    <text x="${P-6}" y="${y+4.5}" font-size="12.5" font-weight="600" fill="#3a4360" text-anchor="end">${r1(v)}</text>`; }
  const pts=points.map((p,i)=>`${X(i)},${Y(p.value)}`).join(' ');
  return `<svg viewBox="0 0 ${W} ${H}" class="chart" role="img">${grid}
    <polyline points="${pts}" fill="none" stroke="${opts.color||'#1b6b3a'}" stroke-width="3.2" stroke-linejoin="round" stroke-linecap="round"/>
    ${points.map((p,i)=>`<circle cx="${X(i)}" cy="${Y(p.value)}" r="5.6" fill="#fff" stroke="#f5a623" stroke-width="3" ${p.onclick?`onclick="${p.onclick}" style="cursor:pointer"`:''}><title>${esc(p.label)}: ${p.value}${p.onclick?' — tap for details':''}</title></circle>
      <text x="${X(i)}" y="${Y(p.value)-12}" font-size="14" text-anchor="middle" fill="#141a2e" font-weight="800">${p.value}</text>
      <text x="${X(i)}" y="${H-P+20}" font-size="12.5" text-anchor="middle" fill="#3a4360" font-weight="600">${esc(p.label)}</text>`).join('')}
  </svg>`;
}
function barChartSVG(data, opts){
  opts=opts||{}; const W=720,H=230,P=42;
  const max=Math.max(1,...data.map(d=>d.value))*1.15;
  const bw=(W-2*P)/Math.max(1,data.length);
  let grid=''; for(let g=0;g<=4;g++){ const v=max*g/4, y=H-P-(H-2*P)*g/4;
    grid+=`<line x1="${P}" y1="${y}" x2="${W-P}" y2="${y}" stroke="#ccd4e6" stroke-width="1.2"/><text x="${P-6}" y="${y+4.5}" font-size="12.5" font-weight="600" fill="#3a4360" text-anchor="end">${opts.money?'':r1(v)}</text>`; }
  return `<svg viewBox="0 0 ${W} ${H}" class="chart">${grid}
    ${data.map((d,i)=>{ const h=(H-2*P)*d.value/max, x=P+i*bw+bw*0.18, y=H-P-h;
      const lbl = String(d.label).length>9? String(d.label).slice(0,8)+'…' : d.label;
      return `<rect x="${x}" y="${y}" width="${bw*0.64}" height="${h}" rx="5" fill="${d.color||opts.color||'#1b6b3a'}" ${d.onclick?`onclick="${d.onclick}" style="cursor:pointer"`:''}>
        <title>${esc(d.label)}: ${d.disp!=null?d.disp:d.value}${d.onclick?' — tap for details':''}</title></rect>
      <text x="${x+bw*0.32}" y="${y-7}" font-size="13.5" text-anchor="middle" fill="#141a2e" font-weight="800">${d.disp!=null?d.disp:d.value}</text>
      <text x="${x+bw*0.32}" y="${H-P+19}" font-size="12.5" text-anchor="middle" fill="#3a4360" font-weight="600">${esc(lbl)}</text>`; }).join('')}
  </svg>`;
}

A.saveStudent=function(id){
  const s=mySchool();
  const v={ sn:$('#st-sn').value.trim(), fn:$('#st-fn').value.trim(), on:$('#st-on').value.trim(),
    g:$('#st-g').value, dob:$('#st-dob').value, adm:$('#st-adm').value, cls:$('#st-cls').value,
    house:$('#st-house').value, ph:$('#st-ph').value.trim(), rel:$('#st-rel').value, res:$('#st-res').value.trim(),
    gn:$('#st-gn').value.trim(), nat:$('#st-nat').value.trim() };
  const cms=['Call','SMS','WhatsApp'].filter(m=>$('#cm-'+m)&&$('#cm-'+m).checked);
  if(!v.sn||!v.fn||!v.g||!v.dob||!v.adm||!v.cls||!v.ph||!v.res) return toast('Fill all required fields (*)','bad');
  if(!cms.length) return toast('Preferred Mode of Communication is required — tick Call, SMS and/or WhatsApp','bad');
  if(!v.rel) return toast('Relationship to guardian is required — click to select (never pre-selected)','bad');   /* Round-60 */
  if(!id && featureBlocked('addStudent')) return lockFeatureToast('Student registration');
  /* Round-17: duplicate guard — reject when surname+first+other names+gender+DOB+guardian phone ALL match an existing student */
  const norm=x=>String(x==null?'':x).trim().toLowerCase().replace(/\s+/g,' ');
  const dup=DB.students.find(x=>x.schoolId===s.id && !x.archived && x.id!==id &&
    norm(x.surname)===norm(v.sn) && norm(x.firstName)===norm(v.fn) && norm(x.otherName||'')===norm(v.on) &&
    (x.gender||'')===v.g && (x.dob||'')===v.dob && norm(x.parentPhone||'')===norm(v.ph));
  if(dup){
    const dc=classOf(s,dup.classId);
    openModal(`${mHead('⚠️ Duplicate student — registration rejected', true)}<div class="m-body">
      <div class="notice bad mb2"><b>⛔ Not saved.</b> A student with the <b>same surname, first name, other name(s), gender, date of birth AND parent/guardian phone</b> is already registered — this looks like a <b>duplicate record</b>.</div>
      <div class="kv mb2">
        <div>Existing student</div><div><b>${esc((dup.firstName||'')+' '+(dup.otherName||'')+' '+(dup.surname||''))}</b></div>
        <div>Student ID / class</div><div><b>${esc(dup.sid||'—')}</b> · ${dc?esc(dc.name):'—'}</div>
        <div>Gender / date of birth</div><div>${genderLabel(dup.gender)} · ${fmtD(dup.dob)}</div>
        <div>Guardian phone</div><div>${esc(dup.parentPhone||'—')}</div>
      </div>
      <div class="notice info mini">💡 To protect data quality the system will not register the same child twice.
      If this is genuinely a <b>different</b> child (e.g. twins or relatives sharing one guardian phone), please use a <b>different guardian phone number</b> —
      the combination of names + gender + date of birth + phone must not match exactly.</div>
    </div><div class="m-foot"><button class="btn ghost" onclick="A.closeModal()">✖ Go back &amp; fix</button>
    <button class="btn" onclick="A.viewStudent('${dup.id}')">👁 View existing student</button></div>`);
    return toast('⛔ Duplicate rejected — this name + gender + DOB + guardian phone is already registered','bad');
  }
  if(id){
    const st=DB.students.find(x=>x.id===id);
    Object.assign(st,{surname:v.sn,firstName:v.fn,otherName:v.on,gender:v.g,dob:v.dob,adm:v.adm,classId:v.cls,
      houseId:v.house||autoHouse(s,v.cls),parentPhone:v.ph,guardianName:v.gn,relationship:v.rel,residence:v.res,
      nationality:v.nat||'Ghanaian',commModes:cms,photo:_tmpPhoto});
    st.needsInfo=false;   // details completed by the School Admin
    if(_tmpPhoto){ st.pictureStatus='uploaded'; st.pictureDeadline=null; }
    else { st.pictureStatus='pending'; assignPicDeadline(st); }
    saveDB(); closeModal(); toast('Student updated','ok'); render(); return;
  }
  const st={ id:uid('st'), schoolId:s.id, sid:nextStudentSid(s,v.adm,v.g), surname:v.sn, firstName:v.fn, otherName:v.on,
    gender:v.g, dob:v.dob, adm:v.adm, classId:v.cls, houseId:v.house||autoHouse(s,v.cls), parentPhone:v.ph,
    guardianName:v.gn, relationship:v.rel, residence:v.res, nationality:v.nat||'Ghanaian', religion:'', commModes:cms,
    photo:_tmpPhoto, pictureStatus:_tmpPhoto?'uploaded':'pending', pictureDeadline:_tmpPhoto?null:addWorkingDays(todayISO(),5),
    archived:false, createdAt:Date.now(), carried:null };
  DB.students.push(st); saveDB(); closeModal();
  toast(`Student registered — ID <b>${st.sid}</b>`,'ok'); render();
};
function autoHouse(s, classId){
  const hs=s.houses||[]; if(!hs.length) return null;
  const c=classOf(s,classId);
  if(c && c.stream==='Pre-school') return null;   // pre-school pupils are not deployed to houses
  const counts=hs.map(h=>({h, n:activeStudents(s.id).filter(st=>st.houseId===h.id).length}));
  counts.sort((a,b)=>a.n-b.n); return counts[0].h.id;
}
A.archiveStudent=function(id){

A.deleteStudentForever=function(id){
  const st=DB.students.find(x=>x.id===id); if(!st) return;
  const nScores=Object.keys(DB.scores||{}).filter(k=>k.split('|')[0]===id).length;
  const owes=(st.carried&&st.carried.amount)||0;
  if(!confirm(`⚠ Permanently delete ${st.firstName} ${st.surname} (${st.sid||'no ID'})?`+(owes?`\nThe student OWES money — the School Admin may still delete permanently (owing or not owing).`:'')+(nScores?`\n${nScores} score record(s) + comments & attendance will be erased.`:'')+`\n\nThis CANNOT be undone.`)) return;

const TCH_COLS=['FullName','Gender','Email','Phone','ClassTeacherOf','AllSubjectsForOwnClass','SubjectsOwnClass','SubjectsForOtherClasses'];
const TCH_EXAMPLE=['Akosua Owusu','Female','a.owusu@myschool.edu.gh','0244000111','Basic 5','Yes','Mathematics;English Language','Basic 6:Mathematics'];
function missingTchInfo(t){ const m=[]; if(!t.email) m.push('email'); if(!t.phone) m.push('phone'); if(!t.gender) m.push('gender'); return m; }
function validateTeacherRows(school, rows){
  if(!rows||!rows.length) return {errors:['The file is empty — no rows found.'], records:[]};
  const head=(rows[0]||[]).map(h=>String(h==null?'':h).trim().replace(/\s/g,'').toLowerCase());
  const ix={}; TCH_COLS.forEach(c=>{ const i=head.indexOf(c.toLowerCase()); if(i>=0) ix[c]=i; });
  if(ix.FullName==null) return {errors:['Header row not recognised — download the Teacher Template first (columns: FullName, …).'], records:[]};
  const errors=[], records=[];
  rows.slice(1).forEach((r,i)=>{ const ln=i+2;
    if(!r||r.every(c=>!String(c==null?'':c).trim())) return;
    const get=c=> ix[c]==null? '' : String(r[ix[c]]==null?'':r[ix[c]]).trim();
    const rec={_ln:ln};
    rec.name=get('FullName'); if(!rec.name) errors.push(`Row ${ln}: FullName is required`);
    const gv=get('Gender'), g=gmap(gv);
    if(gv&&!g) errors.push(`Row ${ln}: Gender is invalid (use Male or Female)`);
    rec.gender=g==='M'?'Male':g==='F'?'Female':'';
    rec.email=get('Email').toLowerCase();
    if(rec.email && !/^\S+@\S+\.\S+$/.test(rec.email)){ errors.push(`Row ${ln}: Email is invalid — left blank for the admin to fix`); rec.email=''; }
    rec.phone=get('Phone').replace(/[\s-]/g,'');
    if(rec.phone && !/^\+?\d{9,13}$/.test(rec.phone)){ errors.push(`Row ${ln}: Phone is invalid — left blank for the admin to fix`); rec.phone=''; }
    const cn=get('ClassTeacherOf');
    if(cn){ const cls=findClassByName(school,cn); if(!cls) errors.push(`Row ${ln}: ClassTeacherOf '${cn}' not found`); else rec.classTeacherOf=cls.id; }
    rec.allSubjects=/^(y|yes|true|1)$/i.test(get('AllSubjectsForOwnClass'));
    rec.classSubjects=get('SubjectsOwnClass').split(/[;|]/).map(x=>x.trim()).filter(Boolean);
    const oc={};
    get('SubjectsForOtherClasses').split(/[;|]/).map(x=>x.trim()).filter(Boolean).forEach(pair=>{
      const m=pair.split(':'); if(m.length<2){ errors.push(`Row ${ln}: SubjectsForOtherClasses entry '${pair}' needs the form 'Class:Subject'`); return; }
      const cN=m[0].trim(), sub=m.slice(1).join(':').trim();
      if(!findClassByName(school,cN)){ errors.push(`Row ${ln}: Class '${cN}' not found (SubjectsForOtherClasses)`); return; }
      (oc[cN]=oc[cN]||[]).push(sub); });
    rec.subjectClasses=oc; records.push(rec); });
  return {errors, records}; }
function fuseTeacherRows(school, rows){
  const v=validateTeacherRows(school, rows);
  if(!v.records.length) return {fatal:v.errors.length?v.errors:['No teacher rows found.'], records:[], warnings:[], dropped:0};
  const byRow={}; v.errors.forEach(e=>{ const m=e.match(/^Row (\d+):/); if(m) (byRow[m[1]]=byRow[m[1]]||[]).push(e); });
  const kept=[]; let dropped=0;
  v.records.forEach(rec=>{ if(!rec.name){ dropped++; return; }
    rec.needsInfo=!!byRow[rec._ln]; kept.push(rec); });
  return {fatal:[], records:kept, warnings:v.errors.filter(e=>/^Row \d+:/.test(e)), dropped};
}
function uniqueTchEmail(school, name){
  const slug=String(name||'teacher').toLowerCase().replace(/[^a-z]+/g,'.').replace(/^\.+|\.+$/g,'')||'teacher';
  const dom='@'+(school.abbrev||'school').toLowerCase()+'.edu.gh';
  let em=slug+dom, n=2; while(DB.users.some(u=>u.email&&u.email.toLowerCase()===em)){ em=slug+n+dom; n++; } return em; }
function commitTeacherImport(school, records){ let added=0, skipped=0;
  records.forEach(rec=>{
    let email=rec.email;
    if(email && DB.users.some(u=>u.email&&u.email.toLowerCase()===email)){ skipped++; return; }   // duplicate email → skip
    if(!email){ email=uniqueTchEmail(school, rec.name); rec.needsInfo=true; }
    DB.users.push({ id:uid('u'), role:'teacher', schoolId:school.id, name:rec.name, email, phone:rec.phone||'',
      gender:rec.gender||'', pw:enc(TEACHER_DEFAULT_PW), mustChange:true, active:true, createdAt:Date.now(), lastLoginDate:null,
      needsInfo:!!(rec.needsInfo||!rec.phone||!rec.gender),
      assignments:{ classTeacherOf:rec.classTeacherOf||null, allSubjects:!!rec.allSubjects,
        classSubjects:rec.classSubjects||[], subjectClasses:rec.subjectClasses||{} } });
    added++; });
  saveDB(); return {added, skipped}; }

/* ================= BULK IMPORT / EXPORT + PASSPORT PICTURES (Round-12) ================= */
const TEMPLATE_COLS=['FirstName','LastName','OtherNames','Gender','DateOfBirth','Class','House','GuardianFullName','GuardianPhone','GuardianRelationship','GuardianAddress','PreferredCommunicationMode','Nationality','Religion'];
const TEMPLATE_EXAMPLE=['Ama','Mensah','Serwaa','Female','2015-06-10','Class 5A','Red House','Kwame Mensah','0244123456','Father','Kumasi','WhatsApp;SMS','Ghanaian','Christian'];

function findClassByName(school, txt){ const t=String(txt||'').trim(); if(!t) return null;
  const cs=sortClasses(school);
  const norm=x=>String(x).toLowerCase().replace(/[^a-z0-9]/g,'');
  const nt=norm(t);
  let hit=cs.find(c=>norm(c.name)===nt); if(hit) return hit;
  const core=x=>norm(x).replace(/^(class|grade|basic|primary|jhs|kg|nursery|creche|bs)/,'');
  const ct=core(t);
  hit=cs.find(c=>{ const cc=core(c.name); return cc&&ct&&(cc===ct||ct.indexOf(cc)===0||cc.indexOf(ct)===0); });
  return hit||null; }
function gmap(v){ const t=String(v||'').trim().toLowerCase(); if(!t) return '';
  if(t==='male'||t==='m') return 'M'; if(t==='female'||t==='f') return 'F'; return null; }
function commParse(v){ const raw=String(v||'').split(/[;,|\/+]/).map(x=>x.trim()).filter(Boolean);
  const out=[], bad=[];
  raw.forEach(x=>{ const l=x.toLowerCase();
    if(l==='call'||l==='phone call'||l==='phone') out.push('Call');
    else if(l==='sms'||l==='text') out.push('SMS');
    else if(l==='whatsapp'||l==='wa') out.push('WhatsApp');
    else bad.push(x); });
  return {modes:[...new Set(out)], bad}; }
function validateStudentRows(school, rows){
  if(!rows||!rows.length) return {errors:['The file is empty — no rows found.'], records:[]};
  const head=(rows[0]||[]).map(h=>String(h==null?'':h).trim().replace(/\s/g,'').toLowerCase());
  const ix={}; TEMPLATE_COLS.forEach(c=>{ const i=head.indexOf(c.toLowerCase()); if(i>=0) ix[c]=i; });
  if(ix.FirstName==null||ix.LastName==null) return {errors:['Header row not recognised — download the Template first (columns: FirstName, LastName, …).'], records:[]};
  const errors=[], records=[];
  rows.slice(1).forEach((r,i)=>{ const ln=i+2;   // Excel-style row number (header = row 1)
    if(!r||r.every(c=>!String(c==null?'':c).trim())) return;   // skip blank rows
    const get=c=> ix[c]==null? '' : String(r[ix[c]]==null?'':r[ix[c]]).trim();
    const rec={_ln:ln};
    rec.firstName=get('FirstName'); if(!rec.firstName) errors.push(`Row ${ln}: FirstName is required`);
    rec.surname=get('LastName'); if(!rec.surname) errors.push(`Row ${ln}: LastName is required`);
    rec.otherName=get('OtherNames');
    const gv=get('Gender'), g=gmap(gv);
    if(!gv) errors.push(`Row ${ln}: Gender is required`); else if(!g) errors.push(`Row ${ln}: Gender is invalid (use Male or Female)`);
    rec.gender=g||'M';
    rec.dob=get('DateOfBirth'); if(rec.dob && !/^\d{4}-\d{2}-\d{2}$/.test(rec.dob)) errors.push(`Row ${ln}: DateOfBirth must be YYYY-MM-DD (e.g. 2015-06-10)`);
    const cn=get('Class');
    if(!cn) errors.push(`Row ${ln}: Class is required`);
    else { const cls=findClassByName(school,cn); if(!cls) errors.push(`Row ${ln}: Class '${cn}' not found — valid: ${sortClasses(school).map(c=>c.name).join(', ')}`); else rec.classId=cls.id; }
    rec._house=get('House');
    rec.guardianName=get('GuardianFullName'); if(!rec.guardianName) errors.push(`Row ${ln}: GuardianFullName is required`);
    const ph=get('GuardianPhone').replace(/[\s-]/g,'');
    if(!ph) errors.push(`Row ${ln}: GuardianPhone is required`); else if(!/^\+?\d{9,13}$/.test(ph)) errors.push(`Row ${ln}: GuardianPhone is invalid`); else rec.parentPhone=ph;
    rec.relationship=get('GuardianRelationship');
    rec.residence=get('GuardianAddress');
    const cmv=get('PreferredCommunicationMode'), cm=commParse(cmv);
    if(!cmv) errors.push(`Row ${ln}: PreferredCommunicationMode is required`);
    else if(cm.bad.length) errors.push(`Row ${ln}: PreferredCommunicationMode has invalid value(s): ${cm.bad.join(', ')} (use Call, SMS, WhatsApp)`);
    else if(!cm.modes.length) errors.push(`Row ${ln}: PreferredCommunicationMode is required`);
    rec.commModes=cm.modes;
    rec.nationality=get('Nationality')||'Ghanaian';
    rec.religion=get('Religion');
    records.push(rec); });
  return {errors, records}; }
/* Round-26: FUSION import — per-row problems become WARNINGS, not rejections. Partial rows are imported
   with sensible defaults and flagged needsInfo so the School Admin completes the details later in the app. */
function missingStuInfo(st){ const m=[]; if(!st.guardianName) m.push('guardian full name'); if(!st.parentPhone) m.push('guardian phone');
  if(!(st.commModes||[]).length) m.push('communication mode'); if(!st.residence) m.push('residence'); if(!st.dob) m.push('date of birth'); return m; }
function fuseStudentRows(school, rows){
  const v=validateStudentRows(school, rows);                       // strict rules still generate the messages…
  if(!v.records.length) return {fatal:v.errors.length?v.errors:['No student rows found.'], records:[], warnings:[], dropped:0};
  const byRow={}; v.errors.forEach(e=>{ const m=e.match(/^Row (\d+):/); if(m) (byRow[m[1]]=byRow[m[1]]||[]).push(e); });
  const kept=[]; let dropped=0; const firstCls=sortClasses(school)[0];
  v.records.forEach(rec=>{
    if(!rec.firstName||!rec.surname){ dropped++; return; }          // a nameless row cannot be fused at all
    let miss=!!byRow[rec._ln];
    if(!rec.classId){ if(firstCls) rec.classId=firstCls.id; miss=true; }   // unknown/missing class → first class, review later
    rec.needsInfo=miss; kept.push(rec); });
  return {fatal:[], records:kept, warnings:v.errors.filter(e=>/^Row \d+:/.test(e)), dropped};
}
function importHouseId(school, rec){ const nm=String(rec._house||'').trim();
  if(!nm) return autoHouse(school, rec.classId);
  const h=(school.houses||[]).find(x=>x.name.toLowerCase()===nm.toLowerCase()); if(h) return h.id;
  const c=classOf(school,rec.classId); if(c&&c.stream==='Pre-school') return null;
  school.houses=school.houses||[];
  const nh={id:uid('h'), name:nm, color:HOUSE_COLORS[school.houses.length%HOUSE_COLORS.length]};
  school.houses.push(nh); return nh.id; }
function commitImport(school, records){ const now=todayISO(); let added=0, skipped=0; const ids=[];
  records.forEach(rec=>{
    const dup=DB.students.some(x=>x.schoolId===school.id && !x.archived &&
      (x.firstName||'').toLowerCase()===rec.firstName.toLowerCase() && (x.surname||'').toLowerCase()===rec.surname.toLowerCase() &&
      x.classId===rec.classId && (!rec.dob || x.dob===rec.dob));
    if(dup){ skipped++; return; }
    const st={ id:uid('st'), schoolId:school.id, sid:nextStudentSid(school, now, rec.gender),
      surname:rec.surname, firstName:rec.firstName, otherName:rec.otherName||'', gender:rec.gender,
      dob:rec.dob||((Number(now.slice(0,4))-10)+'-01-01'), adm:now, classId:rec.classId,
      houseId:importHouseId(school,rec), parentPhone:rec.parentPhone, guardianName:rec.guardianName||'',
      relationship:rec.relationship||'', residence:rec.residence||'', commModes:rec.commModes||[],
      nationality:rec.nationality||'Ghanaian', religion:rec.religion||'',
      photo:null, pictureStatus:'pending', pictureDeadline:addWorkingDays(now,5),
      needsInfo:!!rec.needsInfo, archived:false, createdAt:Date.now(), carried:null };
    DB.students.push(st); ids.push(st.id); added++; });
  saveDB(); return {added, skipped, ids}; }
function exportRowOf(school, st){ const c=classOf(school,st.classId); const h=(school.houses||[]).find(x=>x.id===st.houseId);
  return [st.firstName, st.surname, st.otherName||'', st.gender==='M'?'Male':'Female', st.dob||'', c?c.name:'', h?h.name:'',
    st.guardianName||'', st.parentPhone||'', st.relationship||'', st.residence||'', (st.commModes||[]).join(';'), st.nationality||'Ghanaian', st.religion||'']; }

A.stuImportText=async function(name, data){
  let rows;

  go('passport'); };

function shrinkImage(dataUrl, max, q, cb){ try{
  const img=new Image();
  img.onload=()=>{ try{ const sc=Math.min(1, max/Math.max(img.width||max, img.height||max));
      const cv=document.createElement('canvas'); cv.width=Math.max(1,Math.round((img.width||max)*sc)); cv.height=Math.max(1,Math.round((img.height||max)*sc));
      cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);
      cb(cv.toDataURL('image/jpeg', q||0.85));
    }catch(e){ cb(dataUrl); } };
  img.onerror=()=>cb(dataUrl); img.src=dataUrl;
  }catch(e){ cb(dataUrl); } }
A.ppFile=function(stId, inp){ const f=inp.files&&inp.files[0]; if(!f) return;
  if(f.size>8000000) return toast('Image too large (max 8MB)','bad');
  const r=new FileReader();
  r.onload=e=>{ shrinkImage(e.target.result, 320, 0.82, (dataUrl)=>{ setStudentPhoto(stId, dataUrl); toast('Passport picture saved ✅','ok'); render(); }); };
  r.readAsDataURL(f); };

let PP_CAM_STREAM=null;
function ppCamStop(){ try{ if(PP_CAM_STREAM){ PP_CAM_STREAM.getTracks().forEach(t=>t.stop()); } }catch(e){} PP_CAM_STREAM=null; }
A.ppCam=function(stId){
  const hasCam=!!(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia);

    <div id="pp-cam-box">

        <div class="small mut mt1">Camera starting… align the student's face in the frame, then press <b>Capture</b>.</div>`
      : `<div class="notice warn mini mb2">⚠ This browser can't open a live camera view. Use the button below — your phone will open its camera directly.</div>
         <label class="btn gold" data-tip="Open the system camera">📸 Open camera<input type="file" accept="image/*" capture="user" hidden onchange="A.ppFile('${stId}',this);A.ppCamClose()"></label>`}
    </div>
  </div><div class="m-foot">
    <button class="btn ghost" onclick="A.ppCamClose()">✖ Close</button>
    ${hasCam?`<button class="btn gold" onclick="A.ppCamShot('${stId}')">📸 Capture</button>`:''}
  </div>`);
  if(hasCam){
    navigator.mediaDevices.getUserMedia({video:{facingMode:'user'}, audio:false}).then(stream=>{
      PP_CAM_STREAM=stream; const v=$('#pp-cam-v'); if(v){ v.srcObject=stream; try{ v.play&&v.play(); }catch(e){} }
    }).catch(()=>{ const b=$('#pp-cam-box'); if(b) b.innerHTML='<div class="notice warn mini">⚠ Camera unavailable or permission denied — close and use 📁 Upload Picture instead.</div>'; });

};
A.ppCamShot=function(stId){
  const v=$('#pp-cam-v');

  cv.getContext('2d').drawImage(v,0,0,cv.width,cv.height);
  const dataUrl=cv.toDataURL('image/jpeg',0.85);
  shrinkImage(dataUrl, 320, 0.82, (shrunk)=>{
    setStudentPhoto(stId, shrunk);
    A.ppCamClose(); toast('📸 Photo captured & saved ✅','ok'); render();
  });
};
A.ppCamClose=function(){ ppCamStop(); closeModal(); };

/* ================= STUDENT PROMOTION MODULE (Academics > Promote Students) =================

function renderPromote(){
  const s=mySchool();
  const classes=sortClasses(s);
  if(!PROM.classId){

A.promoTo=function(){
  const s=mySchool(); const from=classOf(s,PROM.classId); if(!from) return;
  const n=promoSelCount();
  if(!n) return toast('Select at least one student to promote','bad');
  const others=sortClasses(s).filter(c=>c.id!==PROM.classId);
  if(!others.length) return toast('No destination class exists — create another class first','bad');
  const dest=PROM.dest?classOf(s,PROM.dest):null;
  openModal(`${mHead('⬆️ Promote To — choose destination class')}<div class="m-body">

    <div style="display:flex;gap:.5rem;flex-wrap:wrap">

    </div>

A.promoApply=function(){
  const s=mySchool(); const from=classOf(s,PROM.classId), to=classOf(s,PROM.dest);
  if(!from||!to) return toast('Choose a destination class first','bad');
  const ids=Object.keys(PROM.sel).filter(k=>PROM.sel[k]);
  if(!ids.length) return toast('Select at least one student to promote','bad');
  const yr=yearSel(); let moved=0;
  ids.forEach(id=>{ const st=DB.students.find(x=>x.id===id&&x.schoolId===s.id); if(!st) return;

  toast(`✅ ${moved} student${moved===1?'':'s'} successfully promoted from ${from.name} to ${to.name}`,'ok');

};
